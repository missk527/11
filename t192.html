<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Test - 11+ (T19)</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:20px;color:#172033}
.container{max-width:1050px;margin:auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 5px 16px rgba(0,0,0,.08)}
.passage{background:#fafafa;padding:22px;border-left:6px solid #0f172a;white-space:pre-line;line-height:1.9;margin-bottom:20px}
button{background:#0f172a;color:#fff;padding:10px 16px;margin:5px;border:0;cursor:pointer;border-radius:8px}
button:hover{opacity:.92}.correct{color:green}.wrong{color:#b91c1c}
label{display:block;margin:8px 0}.meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.small{color:#475569;font-size:14px}.note{color:#334155;font-size:13px;margin:4px 0 14px}
.progress{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#0f172a}
</style>
</head>
<body>
<main class="container">
<h1>Reading Test (11+) — T19</h1>
<div class="meta"><div id="timer"></div><div class="small">3 passages • 20 questions each • 60 questions total</div></div>
<div class="note">T19 tests close reading, inference, vocabulary in context, tone, structure, and precise summary.</div>
<div class="progress"><span id="bar"></span></div>
<section id="passage" class="passage"></section>
<section id="q"></section>
<button onclick="prev()">Previous</button><button onclick="next()">Next</button><button onclick="submitTest()">Submit</button>
<div id="score"></div><div id="review"></div>
</main>
<script>
const data=[{"title":"Passage 1 — The Map in the Rain","text":"Mara’s grandfather kept a map of the town pinned beside his kitchen door. It showed no roads or buildings. Instead, thin blue lines wandered across the paper, each one labelled with a date. Some stopped at the river; others looped around the market square or ended abruptly behind the railway station.\n\nMara had always assumed the lines marked old walking routes. Then, during a week of heavy rain, her grandfather took down the map and carried it outside beneath a clear folder. At the corner of Mill Street, water had collected across the pavement. He drew a short blue curve around the puddle and wrote the date beside it.\n\n“It is a map of where rainwater travels,” he explained. For thirty years he had noted overflowing drains, temporary streams and places where water gathered. Most marks seemed harmless, but together they revealed patterns that ordinary street maps ignored.\n\nThe following afternoon, Mara joined him. Near the closed cinema, she noticed leaves covering a drain. Water was already creeping towards the doorway of a bakery. They cleared the leaves with a stick, and the water spun away. Her grandfather added a small star to the map.\n\nMonths later, the council announced plans to repair drains in the neighbourhood. Engineers visited the kitchen and studied the blue lines. They had computer models and recent measurements, but Mara’s grandfather possessed something their machines did not: a record of many seasons.\n\nAfter the repairs, he gave Mara a new sheet of paper. “A useful map,” he said, “doesn’t only tell you where things are. Sometimes it tells you what keeps happening.”","questions":[["Where was the map kept?",["Inside the railway station","At the council office","Behind the cinema","Beside the kitchen door"],3],["What was unusual about it?",["It showed no roads or buildings","It was printed on metal","It had no labels","It showed only railway lines"],0],["What did Mara first think the blue lines showed?",["Bus journeys","Old walking routes","Underground pipes","Town boundaries"],1],["Why did Grandfather take the map outside?",["To protect it from the kitchen","To show it to an engineer","To add a new rainwater observation","To sell it at the market"],2],["What had formed on Mill Street?",["A fallen tree","A new road","A market stall","A puddle across the pavement"],3],["What did the dates record?",["When water patterns were observed","When roads were built","Family birthdays","Council meetings"],0],["For how long had Grandfather kept records?",["Fifty years","Thirty years","Three years","Thirteen years"],1],["What could the lines reveal together?",["The age of each building","The depth of the river","Repeated patterns of water movement","The fastest route home"],2],["What blocked the drain near the cinema?",["Mud bricks","A bicycle","Snow","Leaves"],3],["What was the water moving towards?",["A bakery doorway","The railway platform","Grandfather’s kitchen","The river bridge"],0],["How did Mara and Grandfather clear the drain?",["With a hose","With a stick","With a machine","With their shoes"],1],["What did Grandfather add after the drain cleared?",["A street name","A photograph","A small star","A red circle"],2],["Why did council engineers study the map?",["They wanted walking routes","They were rebuilding the cinema","They needed a tourist guide","They were planning drain repairs"],3],["What did the engineers already have?",["Computer models and recent measurements","Thirty years of notes","Mara’s new sheet","Old family photographs"],0],["What special value did Grandfather’s map provide?",["A record of council workers","Evidence gathered over many seasons","Perfectly accurate street names","Instructions for fixing computers"],1],["In context, “creeping” suggests the water moved:",["Backwards","Instantly","Slowly and steadily","Loudly and violently"],2],["Why is the final sheet given to Mara?",["To replace a ruined map","To help with homework","To wrap the old map","To invite her to continue observing"],3],["The grandfather is best described as:",["Patient and observant","Careless and impatient","Secretive and unfriendly","Fearful and confused"],0],["Which theme is central?",["Maps must show roads","Long observation can reveal important patterns","Modern machines are never useful","Rain should always be avoided"],1],["Which is the best summary?",["Engineers replace Grandfather’s map with a computer","A bakery closes because of a puddle","A long-kept map of rainwater patterns helps Mara and the council understand and improve local drainage","Mara draws a tourist map during a storm"],2]]},{"title":"Passage 2 — The Borrowed Note","text":"On the morning of the school concert, Ivo discovered that the middle C key on the music-room piano made no sound. The felt hammer inside rose when he pressed the key, but stopped a finger’s width from the string.\n\nThe piano tuner could not arrive until Monday. Mrs Chen suggested moving the concert to another room, yet the hall was the only place large enough for the audience. Ivo, who was due to play a solo, tried avoiding middle C. The melody sounded as though a word had vanished from every sentence.\n\nDuring rehearsal, Selene, the cellist, listened from the front row. “What if I lend it to you?” she asked. Whenever the missing note appeared, she could play middle C on her cello. At first, Ivo disliked the idea. A solo was supposed to belong to one performer. But there was no time to rewrite the programme.\n\nThey practised slowly. Selene had to watch Ivo’s shoulders because his hands were hidden by the piano. Ivo learned to breathe before each missing note, giving her a tiny signal. By evening, the borrowed notes no longer sounded like patches. They became a quiet conversation between the instruments.\n\nThe audience noticed something unusual but could not see the broken key. After the final chord, the applause continued until Ivo beckoned Selene onto the stage. He explained what they had done.\n\nOn Monday, the tuner repaired the piano in ten minutes. Ivo pressed middle C and heard its clear, ordinary sound. He was glad to have it back, though part of him missed the note that had taught him how to listen.","questions":[["When was the broken key discovered?",["During Monday’s lesson","After the concert","A week earlier","On the morning of the concert"],3],["Which key made no sound?",["Middle C","High G","Low A","Middle D"],0],["What did the felt hammer do?",["Moved continuously","Stopped before reaching the string","Struck two strings","Fell out of the piano"],1],["Why could the concert not easily move?",["The audience refused","The cello was fixed in place","Only the hall was large enough","The other rooms had no chairs"],2],["How did the melody sound without the note?",["Faster and brighter","Exactly the same","Too loud","Like sentences missing a word"],3],["Who suggested lending the missing note?",["Selene","Mrs Chen","The tuner","An audience member"],0],["Which instrument did Selene play?",["Trumpet","Cello","Violin","Flute"],1],["Why did Ivo first dislike the plan?",["He could not read music","He wanted to cancel","He thought a solo should have one performer","He disliked the cello’s sound"],2],["Why did they accept the plan?",["The tuner ordered them to","The audience requested it","The piano had many broken keys","There was no time to change the programme"],3],["What could Selene watch for timing?",["Ivo’s shoulders","The hidden hammers","Mrs Chen’s hands","The audience"],0],["What signal did Ivo give?",["A raised hand","A breath before each missing note","A stamped foot","A spoken count"],1],["How did the borrowed notes eventually sound?",["Much louder than the piano","Completely silent","Like a conversation between instruments","Like obvious mistakes"],2],["What could the audience not see?",["Selene’s cello","Ivo’s shoulders","The concert programme","The broken key"],3],["What did Ivo do after the applause?",["Called Selene onto the stage","Played the solo again","Left without speaking","Asked for the tuner"],0],["How long did the repair take?",["Two days","Ten minutes","An hour","All morning"],1],["In context, “beckoned” most nearly means:",["Turned away","Played loudly","Signalled someone to come","Apologised quietly"],2],["Why was middle C “ordinary” on Monday?",["It sounded unpleasant","The tuner changed its pitch","Ivo no longer needed it","Its special role in the duet had ended"],3],["What did Ivo learn?",["To listen and collaborate","To repair pianos","To avoid all solos","To play the cello"],0],["Which theme is central?",["Repairs are always difficult","A limitation can inspire cooperation","Performances must be perfect","Soloists should never share credit"],1],["Which is the best summary?",["Selene replaces Ivo as the soloist","A concert is moved because a key breaks","A broken piano key leads Ivo and Selene to turn a solo into an inventive collaboration","A tuner ruins a concert piano"],2]]},{"title":"Passage 3 — The Winter Lantern","text":"Each December, the residents of Alder Court placed lanterns in their windows. Most were new: glass stars, electric candles and strings of coloured bulbs. On the top floor, however, Mrs Vale displayed the same dented tin lantern every year.\n\nIts sides were punched with small holes, and its handle had been repaired with wire. When lit, it scattered dots across her ceiling like a handful of stars. Tomas, her neighbour, admired it but wondered why she never bought a brighter one.\n\nMrs Vale told him that the lantern had once belonged to a railway porter. During the winter of 1947, snow covered the tracks beyond the town. A passenger train stopped between stations, and the porter walked through the storm carrying the lantern. Its weak beam could not melt snow or repair an engine, but it showed the passengers that help was approaching.\n\n“Sometimes a light is valuable because of who can see it,” she said.\n\nThat year, a power cut darkened Alder Court on the evening of the lantern display. The modern lights vanished at once. People opened their doors and used their phones to find the stairs, but the batteries were already running low.\n\nThen dots of light appeared on the landing wall. Mrs Vale had carried out her old lantern. Its candle was small, yet neighbours gathered around it and moved downstairs together. Tomas held doors while Mrs Vale led the way.\n\nWhen the electricity returned, every window blazed again. Tomas looked up at the bright building, then at the battered lantern on the step. It was the smallest light in Alder Court, but for ten dark minutes it had been the one that mattered.","questions":[["When did residents display lanterns?",["Every summer","Once a week","Only during power cuts","Each December"],3],["Where did Mrs Vale live?",["On the top floor","Beside the railway","In the basement","Across town"],0],["What was her lantern made of?",["Silver","Tin","Glass","Wood"],1],["How had its handle been repaired?",["With string","With leather","With wire","With glue"],2],["What pattern did it cast?",["Long blue lines","A square shadow","Letters","Dots like stars"],3],["Why did Tomas question Mrs Vale’s choice?",["He wondered why she did not buy a brighter lantern","He disliked all lanterns","He wanted to borrow it","He thought it was new"],0],["Who once owned the lantern?",["A shopkeeper","A railway porter","A train driver","Mrs Vale’s neighbour"],1],["What happened in the winter of 1947?",["The lantern was lost","The railway closed forever","A train stopped in deep snow","A station caught fire"],2],["What did the porter do?",["Repaired the engine alone","Carried every passenger","Waited at the station","Walked through the storm with the lantern"],3],["What did the lantern show the passengers?",["That help was approaching","Where the station was","That the snow was melting","When the train would leave"],0],["What interrupted the modern display?",["A fire alarm","A power cut","A snowstorm","A broken window"],1],["Why were phones not a perfect solution?",["They were locked upstairs","The signal was too strong","Their batteries were running low","They had no lights"],2],["Where did the lantern’s dots appear?",["Across the railway track","On the ceiling only","In every window","On the landing wall"],3],["How did neighbours leave the building?",["They gathered and moved together","They ran separately","They waited for electricity","They climbed onto the roof"],0],["What role did Tomas take?",["He called the railway","He held doors","He carried the lantern","He repaired the power"],1],["In context, “blazed” suggests the windows were:",["Painted red","Broken","Very brightly lit","On fire"],2],["Why is the lantern described as “battered”?",["It has no candle","It was damaged that evening","It is extremely bright","It is old and dented"],3],["What does Mrs Vale mean about who can see a light?",["A small sign can give hope to people who need it","Only large lights are useful","Lanterns should be displayed outside","Passengers prefer candlelight"],0],["Which theme is central?",["Neighbours should avoid the dark","Usefulness matters more than appearance or power","Old objects should always be replaced","Electric lights are unreliable"],1],["Which is the best summary?",["A railway porter visits Alder Court","Residents compete to create the brightest display","An old lantern valued for once signalling help proves useful again during a power cut","Tomas buys Mrs Vale a brighter lantern"],2]]}];

let p=0,q=0,answers=[],time=4800,submitted=false;
function timer(){const m=Math.floor(time/60),s=time%60;document.getElementById("timer").innerHTML="<h3>Time: "+m+":"+String(s).padStart(2,"0")+"</h3>";if(time>0&&!submitted){time--;setTimeout(timer,1000)}else if(!submitted)submitTest()}
function load(){document.getElementById("passage").innerHTML="<h2>"+data[p].title+"</h2>"+data[p].text;show()}
function show(){const item=data[p].questions[q];let html="<p><strong>"+item[0]+"</strong></p>";item[1].forEach((opt,i)=>{html+="<label><input type='radio' name='q' onclick='save("+i+")' "+(answers[p*20+q]===i?"checked":"")+"> "+opt+"</label>"});html+="<p>Question "+(p*20+q+1)+" of 60</p>";document.getElementById("q").innerHTML=html;document.getElementById("bar").style.width=((p*20+q+1)/60*100)+"%"}
function save(c){answers[p*20+q]=c}
function next(){if(q<19)q++;else if(p<2){p++;q=0;load();return}show()}
function prev(){if(q>0)q--;else if(p>0){p--;q=19;load();return}show()}
function submitTest(){if(submitted)return;submitted=true;let score=0,review="";data.forEach((pass,pi)=>pass.questions.forEach((qq,qi)=>{const idx=pi*20+qi,user=answers[idx],correct=qq[2];if(user===correct)score++;review+="<p><strong>Q"+(idx+1)+".</strong> "+qq[0]+"<br>Your: <span class='"+(user===correct?"correct":"wrong")+"'>"+(qq[1][user]||"None")+"</span><br>Correct: <span class='correct'>"+qq[1][correct]+"</span></p>"}));document.getElementById("score").innerHTML="<h2>Score: "+score+"/60</h2>";document.getElementById("review").innerHTML=review;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
timer();load();
</script>
</body>
</html>
