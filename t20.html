{title:"Passage 1 — The Clockmaker’s Window",text:`Every morning before school, Nia passed a narrow shop whose window contained twelve clocks. None displayed the correct time. One was seven minutes fast, another had stopped at half past four, and a brass carriage clock steadily ran backwards.

The shop belonged to Mr Bell, who repaired watches at a desk beneath a green lamp. When Nia finally asked about the window, he smiled. “The clocks waiting inside are ill,” he said. “Those in the window are teaching me what is wrong.” Their different mistakes were clues: a regular loss of minutes suggested a tired spring, while an uneven tick might mean dust between tiny teeth.

One Friday, Mr Bell showed Nia a plain wooden clock that had arrived from the library. It lost exactly two minutes every hour. He had cleaned it and replaced its spring, yet the fault remained. Nia watched its pendulum. Each time the front door opened, a draught nudged it slightly.

They moved the clock away from the door. By Saturday it had kept perfect time for eighteen hours. Mr Bell did not celebrate immediately. He placed it beside the warm radiator, then on a level shelf at the back, testing whether heat or position altered its rhythm. It continued faithfully.

When the librarian collected it, Mr Bell wrote “draught” on a small card and slipped the card into a drawer. The drawer held hundreds of such cards.

“Do you remember every repair?” Nia asked.

“No,” he replied. “That is why I keep the mistakes.”

The following Monday, one clock in the window showed the right time. Nia almost hurried past before noticing that it was the wooden library clock, ticking calmly where the draught could no longer reach it.`,questions:[

y did Nia almost miss the clock on Monday?",["The shop was closed","It had been painted","It now showed the correct time","The window was dark"],2],["Mr Bell is best described as:",["Careful and methodical","Hasty and boastful","Forgetful and careless","Impatient and rude"],0],["Which theme is central?",["Old clocks are more valuable","Mistakes can provide useful knowledge","Libraries need better clocks","Children should avoid shops"],1],["Which is the best summary?",["Nia breaks a clock in a repair shop","A librarian teaches Mr Bell about draughts","Nia’s observation helps Mr Bell identify an environmental cause of a clock’s fault","Mr Bell replaces every clock in his window"],2]]},
{title:"Passage 2 — The Silent Rehearsal",text:`The Harbour Players had rehearsed their summer play for six weeks when a storm tore part of the theatre roof away. Rain soaked the curtains and left a dark pool across the stage. The council promised repairs, but not before opening night.

Their director, Amara, refused to cancel. She arranged a rehearsal in the old glasshouse at the public gardens. It was dry and large enough, though its curved roof turned every spoken line into a muddle of echoes. When the actors raised their voices, the words became less clear.

Jonas, who played the ship’s captain, suggested performing without speech. At first the company laughed. Their play contained arguments, jokes and a long farewell. Yet Amara asked them to try one scene. The actors used glances, gestures and changes of pace. A lifted eyebrow replaced a question; a slowly folded coat became the farewell.

The gardener, working among the lemon trees, watched from the doorway. Although he knew nothing of the plot, he correctly guessed which character had hidden the letter. That convinced Amara that the silent version could work.

They spent the week removing movements that were too fussy and enlarging those that mattered. Musicians sat to one side and created sounds with a drum, a violin and a tray of pebbles. The pebbles, tipped gently from end to end, suggested waves sliding over a beach.

On opening night, the audience entered expecting an apology. Instead, each person received a card explaining that the storm had produced “a play for the eyes”. The glasshouse filled with attention rather than echoes.

At the end, there was a pause so complete that Jonas feared they had failed. Then the gardener stood and began to clap. Everyone followed.`,questions:[
["What damaged the theatre?",["A fire","A storm","The audience","The council"],1],["How long had the group rehearsed?",["One week","Four weeks","Six weeks","All summer"],2],["Why could they not use the theatre?",["Rain had damaged the roof and stage","It was too small","The actors were late","The curtains were missing before the storm"],0],["Where did Amara move rehearsal?",["A library","A glasshouse","A school hall","A harbour"],1],["What problem did the curved roof cause?",["Too much heat","Broken glass","Muddled echoes","Falling leaves"],2],["What happened when actors spoke louder?",["Words became less clear","The roof shook","The gardener left","Music began"],0],["Who proposed a play without speech?",["Amara","The gardener","Jonas","The violinist"],2],["Why did the company laugh at first?",["Jonas forgot his costume","The idea seemed unsuitable for their dialogue-rich play","The glasshouse was tiny","Amara told a joke"],1],["What replaced a question?",["A drumbeat","A folded coat","A lifted eyebrow","A tray of pebbles"],2],["What represented the farewell?",["A slowly folded coat","A hidden letter","A closed door","A violin solo"],0],["What did the gardener correctly guess?",["When repairs would finish","Who had hidden the letter","Why the roof broke","Which actor was director"],1],["Why was his guess important?",["It showed the action communicated the story","He had written the play","He offered to repair the roof","It proved he knew the actors"],0],["What did the company remove?",["All costumes","Movements that were too fussy","The lemon trees","Every joke"],1],["Which instrument is NOT mentioned?",["Drum","Violin","Piano","Tray of pebbles"],2],["What did the pebbles suggest?",["Rain on glass","A ship breaking","Footsteps","Waves on a beach"],3],["What did the audience receive?",["An apology card only","A card explaining the new form","A hidden letter","A free instrument"],1],["“A play for the eyes” means a play understood mainly through:",["Movement and sight" {title:"Passage 3 — The Seed Envelope",text:`In the bottom drawer of the school’s science cupboard, Leila found a brown envelope marked “Bean Trial, 1986”. Inside were twenty wrinkled seeds and a sheet of paper covered in neat columns. The final column, headed RESULTS, was empty.

Mr Okoro, the caretaker, remembered the experiment. As a pupil, he and his classmates had planned to compare beans grown in ordinary soil with beans grown in soil mixed with ash. A burst pipe flooded the classroom before they planted them, and the envelope was forgotten during the clean-up.

Leila wanted to finish the trial, but her teacher warned that seeds more than thirty years old might not grow. Instead of throwing them away, the class divided the seeds into four groups. One group was planted immediately. The others were soaked for different lengths of time. Each pot received the same amount of soil, water, warmth and light.

For twelve days, nothing appeared. On the thirteenth morning, a pale hook pushed through one pot. By the end of the week, three seedlings stood beneath the window. All had come from seeds soaked for twenty-four hours.

The result did not answer the original question about ash. It answered a new one: whether careful soaking might wake very old seeds. The class recorded both the success and the seventeen failures.

Mr Okoro visited when the strongest plant produced two white flowers. He read the completed results sheet and laughed softly. “We were impatient in 1986,” he said. “It only took the experiment forty years to begin.”

Leila saved beans from the plant in a fresh envelope. On it she wrote the date, the soaking time and one further instruction: DO NOT FORGET THE FAILURES.`,questions:[

let index=0,answers=Array(60),seconds=4800,submitted=false;
const $=id=>document.getElementById(id);
function render(){const pi=Math.floor(index/20),qi=index%20,p=data[pi],item=p.questions[qi];$("passage").innerHTML=`<h2>${p.title}</h2>${p.text}`;$("question").innerHTML=`<strong>Question ${index+1} of 60</strong><p>${item[0]}</p>`+item[1].map((x,i)=>`<label class="option"><input type="radio" name="answer" ${answers[index]===i?'checked':''} onchange="answers[${index}]=${i}"> ${x}</label>`).join('');$("bar").style.width=`${(index+1)/60*100}%`;$("prev").disabled=index===0;$("next").disabled=index===59;scrollTo({top:0,behavior:'smooth'})}
function move(n){index=Math.max(0,Math.min(59,index+n));render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;$("timer").textContent=`Time: ${m}:${String(s).padStart(2,'0')}`;if(seconds>0&&!submitted){seconds--;setTimeout(tick,1000)}else if(!submitted)submitTest(true)}
function submitTest(auto){if(submitted)return;const blank=answers.filter(x=>x===undefined).length;if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit anyway?`))return;submitted=true;let score=0,out='';data.forEach((p,pi)=>p.questions.forEach((q,qi)=>{const i=pi*20+qi,u=answers[i],ok=u===q[2];if(ok)score++;out+=`<article><strong>Q${i+1}. ${q[0]}</strong><br>Your answer: <span class="${ok?'correct':'wrong'}">${u===undefined?'Not answered':q[1][u]}</span><br>Correct answer: <span class="correct">${q[1][q[2]]}</span></article>`}));$("score").innerHTML=`<h2>Score: ${score}/60</h2><p>${auto?'Time expired — the test was submitted automatically.':`You answered ${60-blank} questions.`}</p>`;$("review").innerHTML=`<h2>Answer review</h2>${out}`;document.querySelectorAll('button,input').forEach(x=>x.disabled=true);$("score").scrollIntoView({behavior:'smooth'})}
tick();render();
</script></body></html>
