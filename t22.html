{title:"Passage 1 — The Map in the Rain",text:`On the first Saturday of the holidays, Arun volunteered at the town museum. His task sounded simple: carry a box of old maps from the storeroom to the reading room. Yet halfway across the courtyard, rain began hammering the glass roof. A gust lifted the lid, and one map slid onto the wet stones.

Arun snatched it up. The paper was damp but not torn. Instead of rubbing it dry, he remembered the curator's warning that old paper could crumble when handled roughly. He laid the map flat between two clean cloths and fetched Ms Vale.

The map showed the river before the railway was built. Near its eastern bend, someone had drawn a tiny blue star. Ms Vale said the mark was not part of the surveyor's original work; its ink was decades newer. Arun wondered whether it marked buried treasure, but Ms Vale smiled. "Museums prefer questions to guesses," she said.

They searched council records and found a photograph from 1928. It showed families skating on a pond beside the river. The pond had later been filled in to build a bus depot. On the back of the photograph, a child called Elsie Ward had written, "Our best winter — marked it on Father's map."

The blue star had not pointed to treasure. It had preserved the place where a happy memory occurred. Ms Vale added the photograph and a note beside the map for an upcoming exhibition. Arun suggested placing a blank town map nearby so visitors could mark places that mattered to them.

{title:"Passage 2 — The Borrowed Song",text:`Mara had been chosen to play the opening tune at the village festival. She practised it each evening on a wooden flute inherited from her grandfather. The melody was lively, but one phrase always sounded stiff, as if the notes were marching instead of dancing.

Two days before the festival, Mara heard a blackbird singing from the gutter. Its call rose in three quick notes, paused, then tumbled down. Without thinking, she copied the rhythm on her flute. The troublesome phrase suddenly loosened.

At rehearsal, however, the bandleader frowned. "That is not how the tune is written," Mr Pike said, tapping the sheet music. Mara explained about the blackbird. He asked her to play both versions. The first was accurate but heavy; the second seemed to lift the whole band. Even the drummer began smiling.

Mr Pike did not decide at once. He asked the other musicians to listen from the far end of the empty hall, where individual mistakes were less obvious but the shape of the music was clearer. They chose Mara's version, provided she could repeat it exactly each time.

On festival morning, the blackbird was nowhere to be seen. Mara felt oddly nervous, as though she had borrowed something without permission. Then she noticed three feathers painted on the old flute's case. Her grandfather had often said that every musician listened before playing.

The band began. When Mara reached the altered phrase, it sprang upward, paused, and swept down. Several people in the crowd glanced towards the rooftops. Afterward, Mr Pike wrote the new rhythm into the band's copy of the music. Above it he added two words: "Blackbird variation."

{title:"Passage 3 — The Last Lantern",text:`Each autumn, the residents of Beacon Row hung paper lanterns outside their houses. The custom began long ago, when the lane had no streetlights and fishermen used the glow to find their way home through fog. Now electric lamps shone at every corner, but the lantern evening continued.

This year, twelve-year-old Tomas was responsible for the final lantern at the steep end of the lane. He built it from thin willow strips and orange paper, following his aunt's instructions. On the afternoon of the celebration, a delivery van reversed into the post and snapped it near the ground.

There was no time to replace the post. Tomas tried hanging the lantern from a tree, but branches hid it from the harbour. He tried the garden wall, but the wind rolled it sideways. Neighbours hurried past carrying food and candles, too busy to notice his problem.

Then Mrs Chen arrived with a long bamboo washing pole. Together they tied the pole to the broken post, using strips cut from an old bicycle inner tube. The rubber stretched tightly without tearing the painted wood. The repair looked untidy, but the lantern stood higher than before.

As dusk settled, fog crept in from the sea. The modern streetlights became pale blurs. One by one, the paper lanterns glowed along the lane. Tomas lit his last. From the harbour came the low horn of a returning boat.

Later, the boat's captain visited the celebration. She explained that the harbour beacon had been visible, but the row of warm lights had shown her exactly where the lane began. Tomas looked at the patched post. What had seemed like a makeshift repair had become part of the old custom's purpose.

The next morning, the council replaced the post. Tomas kept the rubber strips in his toolbox, labelled "Useful when appearances don't matter."`,questions:[

{title:"Passage 1 — The Clockmaker's Window",text:`Every weekday before school, Nia passed Bell & Son, a clockmaker's shop squeezed between a bakery and a bank. Its window held no prices. Instead, dozens of clocks ticked at slightly different speeds, making the glass seem alive.

One Monday, Nia noticed that the smallest clock had stopped. It was shaped like a silver moon and usually swung from a blue thread. Now its hands pointed to 7:13. On Tuesday it still showed 7:13, and a card had appeared beneath it: “Can you lend us a minute?”

Curious, Nia entered. Mr Bell explained that the clock belonged to the town theatre. During performances, it hung above the stage and released a paper moon at exactly the right moment. A new cog was needed, but the workshop drawings had been misfiled years ago. Mr Bell could make a replacement only if he knew the number and size of its teeth.

Nia asked why he could not open the clock and count them. He showed her the casing: a previous repairer had sealed it with a varnish that might crack the delicate silver if forced. “Sometimes,” he said, “the safest way inside a problem is from the outside.”

At school, Nia kept thinking about the blue thread. She borrowed a slow-motion camera from the science cupboard and returned after lessons. Mr Bell gently wound the clock. Although the hands did not move, the thread twitched in a repeating pattern. Nia filmed it beside a ruler, then enlarged the recording. Seven small movements were followed by one longer movement.

Mr Bell searched a catalogue for mechanisms with that pattern. Only one matched: a cog with fourteen fine teeth and one deeper notch. He made the part, and the theatre technician fitted it without opening the decorated casing.

On Friday evening, Nia sat in the audience. At 7:13 in the play, the silver clock chimed and a paper moon floated above the stage. The next morning, the card in the shop window had changed. It read: “A minute, wisely used, can save hours.”`,questions:[

{title:"Passage 2 — The Seed Library",text:`The old ticket office at Wrenford station had been empty since trains began using electronic gates. Then, one spring, shelves appeared behind its dusty windows. Rows of labelled envelopes replaced the timetables, and a painted sign announced: SEED LIBRARY — BORROW, GROW, RETURN.

Samir thought the sign contained a mistake. Library books were returned, but seeds disappeared into soil. Inside, Ms Okafor explained that gardeners borrowed seeds and later returned some collected from the plants they grew. In this way, varieties suited to Wrenford's weather could be shared rather than lost.

Samir chose an envelope of striped beans because its label promised purple pods. At home, he planted all twelve seeds in a neat row beside the fence. For two weeks, nothing appeared. He watered the row more often, until the soil became a dark ribbon of mud.

His neighbour, Rosa, leaned over the fence. She asked Samir to dig beside one seed rather than pull it up. The bean was swollen but unbroken. “It has water,” Rosa said. “What it lacks is air.” Together they loosened the soil with a fork and made narrow channels so extra water could drain away.

Ten seedlings eventually emerged. Samir measured them every Saturday. The two nearest the wall grew tallest but produced few flowers. The shorter plants, which received morning sun, became crowded with purple pods. Samir had assumed height meant health; his notebook showed otherwise.

At the end of summer, he allowed the fullest pods to dry on the plants. He shelled them, rejecting any beans that were cracked or stained. From ten plants he collected more than two hundred sound seeds. He kept twenty for the next year and returned the rest in new envelopes.

{title:"Passage 3 — The Quiet Goal",text:`The junior football final had attracted nearly everyone in Alderby. Drums sounded behind one goal, parents waved green scarves, and a local radio reporter balanced a microphone on the low wall. Only Leena, Alderby's goalkeeper, seemed untouched by the noise.

Before each match, Leena performed the same routine. She pressed each boot into the turf, touched the crossbar, and counted four slow breaths. Her teammates teased her for it, but she said the routine made the goal shrink from a noisy stage into three familiar pieces of white metal.

For most of the final, Alderby led by one goal. With two minutes remaining, rain swept across the pitch. A shot skidded off the wet grass, struck Leena's gloves and spun behind her. The score was level.

The crowd groaned. Leena wanted to stare at the muddy mark on her glove, but the referee was already carrying the ball to the centre. She pressed each boot down, touched the crossbar and breathed four times. There was no time to erase the mistake, only time to prepare for the next moment.

No further goals were scored, so the match went to penalties. Each team scored its first four kicks. Alderby's fifth player then struck the post. If the visiting captain scored next, the final would be over.

As the captain placed the ball, the drums became faster. Leena noticed that the player's previous penalties, shown in a video during training, had all travelled low to the goalkeeper's left. But the captain kept glancing towards the opposite corner. Leena wondered whether the glances were deliberate.

She decided to trust the repeated evidence rather than the last-second signal. At the whistle, she drove left. The kick came low, exactly as before, and Leena pushed it around the post.

Alderby scored its next penalty. The following visiting player sent the ball over the bar, and the green scarves erupted. The reporter asked Leena how she had recovered after allowing the equaliser. Leena looked at her still-muddy glove. “I didn't recover from the last shot,” she said. “I got ready for the next one.”`,questions:[

function move(n){index=Math.max(0,Math.min(59,index+n));render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;$("timer").textContent=`Time: ${m}:${String(s).padStart(2,'0')}`;if(seconds>0&&!submitted){seconds--;setTimeout(tick,1000)}else if(!submitted)submitTest(true)}
function submitTest(auto){if(submitted)return;const blank=answers.filter(x=>x===undefined).length;if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit anyway?`))return;submitted=true;let score=0,out='';data.forEach((p,pi)=>p.questions.forEach((q,qi)=>{const i=pi*20+qi,u=answers[i],ok=u===q[2];if(ok)score++;out+=`<article><strong>Q${i+1}. ${q[0]}</strong><br>Your answer: <span class="${ok?'correct':'wrong'}">${u===undefined?'Not answered':q[1][u]}</span><br>Correct answer: <span class="correct">${q[1][q[2]]}</span></article>`}));$("score").innerHTML=`<h2>Score: ${score}/60</h2><p>${auto?'Time expired — the test was submitted automatically.':`You answered ${60-blank} questions.`}</p>`;$("review").innerHTML=`<h2>Answer review</h2>${out}`;document.querySelectorAll('button,input').forEach(x=>x.disabled=true);$("score").scrollIntoView({behavior:'smooth'})}
tick();render();
</script></body></html>
