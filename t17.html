<body>
<main class="container">
<h1>Reading Test (11+) — T17</h1>

const data=[
{title:"Passage 1 — The Quiet Bell",text:`Above the door of Bellweather Library hung a small brass bell. It had no rope, and no mechanism connected it to the door. Nevertheless, it rang once each morning just before the librarian, Mrs Arden, arrived.

Most people assumed that a timer was hidden in the wall. Leo, who delivered newspapers along Bellweather Lane, doubted this explanation. The bell did not ring at exactly the same time. On rainy mornings it sounded later; in summer it was often early. One frosty day, Leo waited across the street and watched.

At first, nothing happened. Then sunlight reached the library roof. A narrow metal strip beneath the bell slowly bent as it warmed. Its tip nudged the bell, producing one clear note. Mrs Arden appeared moments afterwards, following the same patch of sunlight down the lane.

Leo proudly explained his discovery. Mrs Arden smiled but did not seem surprised. The strip, she said, had been fitted by the library’s first caretaker, who disliked clocks but trusted the morning sun. “So the bell does not announce you,” Leo said. “You and the bell are simply listening to the same signal.”

After that, Leo still paused to hear the note. Solving the mystery had not made it ordinary. Instead, he noticed how many events depended on quiet causes: frost loosening its grip, shadows sliding from windows, and a brass strip waking in the warmth.`,questions:[
["Where was the bell?",["Above the library door","Inside the clock tower","Beside Leo’s house","Under the library roof"],0],

["What did most people suspect?",["A hidden timer","A bird on the roof","Mrs Arden pulled a rope","Leo rang it"],0],
["Why did Leo doubt this idea?",["The bell was too old","Its ringing time varied","The wall was transparent","Mrs Arden denied it"],1],
["How did weather affect the bell?",["Rain made it sound later","Frost stopped it forever","Wind rang it all night","Heat made it silent"],0],
["What did Leo do on the frosty morning?",["Entered the library","Waited across the street","Removed the bell","Fetched Mrs Arden"],1],
["What first reached the roof?",["Rainwater","Sunlight","A newspaper","A shadow"],1],
["What caused the metal strip to bend?",["The warmth","The wind","Leo’s touch","The opening door"],0],
["How did the bell produce its note?",["The strip nudged it","A timer struck it","Mrs Arden shook it","A bird landed on it"],0],
["Why did Mrs Arden arrive at nearly the same moment?",["She heard Leo calling","She followed the same sunlight down the lane","She controlled the bell remotely","She always arrived at exactly eight"],1],
["Who had fitted the strip?",["Leo","Mrs Arden","The first caretaker","A clockmaker"],2],
["What did the caretaker dislike?",["Libraries","Clocks","Sunlight","Brass"],1],
["What does Leo mean by “the same signal”?",["Both Mrs Arden and the bell respond to morning sunlight","Both hear a hidden clock","The bell tells Mrs Arden to hurry","Leo signals them both"],0],
["How did solving the mystery affect Leo?",["It bored him","It made him notice hidden causes","It made him stop delivering papers","It frightened him"],1],
["In context, “ordinary” most nearly means:",["Expensive","No longer interesting","Very noisy","Impossible to explain"],1],
["Which detail best shows gradual change?",["The strip slowly bent as it warmed","Leo delivered newspapers","The bell was brass","Mrs Arden smiled"],0],
["The final paragraph has a tone that is:",["Observant and appreciative","Angry and accusing","Gloomy and hopeless","Hurried and comic"],0],
["Which theme is central?",["Understanding can deepen wonder","Machines are always unreliable","Libraries should open earlier","Mysteries must remain unsolved"],0],
["Which is the best summary?",["Leo discovers that sunlight warms a strip which rings the library bell, and the explanation makes him more attentive to subtle causes","Mrs Arden installs a timer to announce her arrival","A caretaker asks Leo to repair a silent bell","A library bell rings whenever its door opens"],0]
]},
{title:"Passage 2 — The Seed Exchange",text:`Every spring, the gardeners of North Row met in the old school hall to exchange seeds. The packets were rarely impressive. Some were folded from envelopes, others from pages of last year’s calendar. On each, the owner had written a name, a colour, and perhaps one brief instruction.

Amita brought twelve silver packets printed with photographs of perfect tomatoes. She had ordered them from a famous supplier and expected them to be claimed first. Yet the longest queue formed beside Mr Bale’s crumpled paper bag. His bean seeds were mottled brown and came with no picture at all.

Amita asked why people wanted them. Mr Bale explained that his family had grown the beans on North Row for sixty years. They tolerated the lane’s heavy soil, climbed despite the sea wind, and ripened during short summers. Each generation of gardeners had saved seeds from the plants that managed best.

“But mine have won prizes,” Amita said.

“Then they have proved themselves somewhere,” Mr Bale replied. “These have proved themselves here.”

That summer was unusually cool. Amita’s tomato plants produced beautiful leaves but little fruit. The old beans climbed steadily and filled their pods. At the next exchange, Amita returned with fewer glossy packets. She also carried small envelopes of marigold seeds collected from flowers that had thrived beside her windy wall. Her labels included the colour, the name, and a new sentence: “Tested on North Row.”`,questions:[
["Where was the seed exchange held?",["In an old school hall","At Mr Bale’s house","Beside the sea","In a supplier’s shop"],0],
["How often did the exchange take place?",["Every week","Every spring","Every five years","Twice each summer"],1],
["What were many packets made from?",["Glass jars","Reused paper","Silver cloth","Wooden boxes"],1],
["What did Amita bring?",["Bean pods","Twelve glossy tomato-seed packets","Marigold plants","A gardening prize"],1],

["Where did the longest queue form?",["At the door","Beside Mr Bale’s bag","Around Amita’s table","Outside the hall"],1],
["How did Mr Bale’s bean seeds look?",["Bright red","Mottled brown","Glossy silver","Pale blue"],1],
["For how long had his family grown the beans locally?",["Six years","Sixteen years","Sixty years","A century"],2],
["Which local difficulty is mentioned?",["Dry sand","Heavy soil","Deep shade","Flooded fields"],1],
["What other condition could the beans withstand?",["Sea wind","Tropical heat","Mountain snow","Complete darkness"],0],
["How had the bean variety adapted over time?",["Gardeners saved seed from the best-performing plants","A supplier redesigned it","Mr Bale painted the seeds","It was grown indoors"],0],
["What was Amita’s main argument for her tomatoes?",["They were cheap","They had won prizes","They grew locally for decades","They needed no water"],1],
["What distinction does Mr Bale make?",["Between proof elsewhere and proof locally","Between beans and flowers","Between prizes and photographs","Between spring and summer"],0],
["What was the summer weather like?",["Unusually cool","Extremely hot","Very dry","Constantly stormy"],0],
["What did Amita’s tomatoes produce?",["Many red fruits","Beautiful leaves but little fruit","Nothing at all","Long seed pods"],1],
["How did the beans perform?",["They failed to climb","They climbed and filled their pods","They produced only leaves","They blew away"],1],
["What did Amita collect for the next exchange?",["Bean seeds","Marigold seeds","Tomato leaves","Calendar pages"],1],
["Why were the marigolds significant?",["They had thrived by her windy wall","They had won a national prize","Mr Bale had ordered them","They grew only indoors"],0],
["What does Amita’s new label reveal?",["She now values local evidence","She no longer likes flowers","She plans to leave North Row","She distrusts all seeds"],0],
["Which is the best summary?",["Amita learns that seeds proven in local conditions may be more useful than impressive seeds rewarded elsewhere","Mr Bale sells expensive beans to defeat Amita","A cold summer destroys every plant on North Row","Gardeners decide to use only printed seed packets"],0]
]},
{title:"Passage 3 — The Last Page",text:`Nico repaired books in a narrow shop where the air smelled of paste, leather and dust. Most customers brought him broken spines or loose pages. One Thursday, however, a woman placed an undamaged green notebook on his desk and asked him to remove its final page.

Nico hesitated. The page was blank, and taking it out would weaken the stitching. The woman, Dr Saye, explained that the notebook had accompanied her on twenty years of field expeditions. Every other page contained observations: rainfall figures, sketches of beetles, lists of plants, and questions she had once hoped to answer.

“The last page has waited long enough,” she said. She planned to frame it above her new desk as a reminder that unfinished work was not the same as failed work.

Nico proposed a safer solution. Rather than cut the page away, he could open the stitching, lift out the final folded section, separate the blank leaf, and sew the notebook together again. The repair would take longer, but the book would remain strong. Dr Saye agreed.

While working, Nico noticed that several questions in the notebook had later been crossed out and replaced by better ones. Answers mattered, he thought, but so did learning what to ask. When Dr Saye collected the book, he returned the blank leaf in a simple frame. In one corner he had written, very lightly, “Room for the next question.” She read the words, then asked him not to erase them.`,questions:[
["What was Nico’s job?",["He repaired books","He studied beetles","He framed paintings","He sold plants"],0],
["What did the shop smell of?",["Flowers and rain","Paste, leather and dust","Ink and smoke","Soap and wood"],1],
["What did customers usually bring?",["Blank notebooks","Broken spines or loose pages","Field equipment","Empty frames"],1],
["What did Dr Saye ask Nico to do?",["Replace the cover","Remove the final page","Copy every note","Sell the notebook"],1],
["Why did Nico hesitate?",["The page contained a secret","Removing it would weaken the stitching","The notebook was too dirty","He disliked Dr Saye"],1],
["What was written on the final page?",["Rainfall figures","A plant list","Nothing","A map"],2],
["How long had Dr Saye used the notebook?",["Two years","Twelve years","Twenty years","Forty years"],2],
["Which item was NOT listed among its contents?",["Beetle sketches","Rainfall figures","Plant lists","Train times"],3],
["Why did Dr Saye want to frame the page?",["To remember that unfinished work need not be failure","To display her best discovery","To hide a mistake","To advertise Nico’s shop"],0],
["What safer method did Nico suggest?",["Cutting through the cover","Opening and resewing the binding","Gluing the blank page down","Removing every folded section"],1],
["What was the disadvantage of Nico’s method?",["It cost the notebook its strength","It would take longer","It erased the observations","It required a new cover"],1],
["What did Nico notice while working?",["Some questions had been replaced by better ones","Every question had been answered","The notebook belonged to someone else","The final page was torn"],0],
["What conclusion did Nico reach?",["Only answers matter","Learning what to ask also matters","Questions should never change","Fieldwork is a waste of time"],1],
["How was the blank leaf returned?",["Loose in the notebook","In a simple frame","Inside a silver packet","Pasted to the shop window"],1],
["What had Nico written?",["Twenty years of answers","Room for the next question","This work is complete","Please do not erase"],1],
["Why was the writing light?",["It was intended as a gentle addition","Nico had run out of ink","Dr Saye could not read dark writing","The frame blocked his hand"],0],
["How did Dr Saye respond?",["She demanded a refund","She asked him to erase it","She asked him to leave it","She ignored the frame"],2],
["In context, “accompanied” most nearly means:",["Travelled with","Argued against","Repaired","Replaced"],0],
["Which theme is most important?",["Useful inquiry can remain open and continue to develop","Old books should never be altered","Scientific work always ends in certainty","Blank pages have no value"],0],
["Which is the best summary?",["Nico carefully removes and frames a scientist’s blank final page, and both recognise it as a symbol of continuing questions rather than failure","Dr Saye asks Nico to destroy an unsuccessful notebook","Nico discovers answers hidden on a blank page","A book repairer refuses to alter a field notebook"],0]
]}];

let p=0,q=0,answers=[],time=4800,submitted=false;
function timer(){const m=Math.floor(time/60),s=time%60;document.getElementById("timer").innerHTML="<h3>Time: "+m+":"+String(s).padStart(2,"0")+"</h3>";if(time>0&&!submitted){time--;setTimeout(timer,1000)}else if(!submitted)submitTest()}
function load(){document.getElementById("passage").innerHTML="<h2>"+data[p].title+"</h2>"+data[p].text;show()}
function show(){const item=data[p].questions[q];let html="<p><strong>"+item[0]+"</strong></p>";item[1].forEach((opt,i)=>{html+="<label><input type='radio' name='q' onclick='save("+i+")' "+(answers[p*20+q]===i?"checked":"")+"> "+opt+"</label>"});html+="<p>Question "+(p*20+q+1)+" of 60</p>";document.getElementById("q").innerHTML=html;document.getElementById("bar").style.width=((p*20+q+1)/60*100)+"%"}
function save(c){answers[p*20+q]=c}
function next(){if(q<19)q++;else if(p<2){p++;q=0;load();return}show()}
function prev(){if(q>0)q--;else if(p>0){p--;q=19;load();return}show()}
function submitTest(){if(submitted)return;submitted=true;let score=0,review="";data.forEach((pass,pi)=>pass.questions.forEach((qq,qi)=>{const idx=pi*20+qi,user=answers[idx],correct=qq[2];if(user===correct)score++;review+="<p><strong>Q"+(idx+1)+".</strong> "+qq[0]+"<br>Your: <span class='"+(user===correct?"correct":"wrong")+"'>"+(qq[1][user]||"None")+"</span><br>Correct: <span class='correct'>"+qq[1][correct]+"</span></p>"}));document.getElementById("score").innerHTML="<h2>Score: "+score+"/60</h2>";document.getElementById("review").innerHTML=review;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
timer();load();
</script>
