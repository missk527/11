<body>

const data=[
{title:"Passage 1 — The Unfinished Map",text:`In the corner of the town museum hung a map that showed every street except one. The missing road was not new, secret, or especially narrow. It ran directly behind the museum and had existed longer than several roads that appeared in confident black ink. Visitors often pointed out the omission, and the curator always replied that the map was unfinished.

This answer puzzled Mara, who volunteered at the museum on Saturdays. The map was dated 1894, and its maker had been dead for more than a century. How, she wondered, could a thing remain unfinished when no one intended to finish it? One wet afternoon, she searched the museum records. She discovered that the mapmaker, Elias Vale, had lived on the absent road. A note in his ledger described a disagreement with the town council, but gave no details. In the map’s empty space, faint pencil marks suggested that the road had first been drawn and then carefully erased.

Mara expected the curator to be delighted by her discovery. Instead, he studied the ledger in silence. “An error can be accidental,” he said at last. “An omission can be an argument.”

The following week, a new label appeared beside the map. It did not restore the road or explain the quarrel. It simply asked visitors to consider what a mapmaker chooses to preserve—and what power may hide inside a blank space.`,questions:[

["What does “an omission can be an argument” imply?",["Leaving something out may express a view","Arguments always cause errors","Maps cannot be trusted at all","The council erased every road"],0],

["Which is the best summary?",["Mara finds proof that all maps are inaccurate","Mara discovers a missing road may have been deliberately erased, changing how the map is presented","A curator refuses to repair a damaged map","Visitors draw a new street on an old map"],1]
]},
{title:"Passage 2 — Borrowed Light",text:`At dusk, the windows of the tower caught the last sunlight and returned it to the valley. From below, the stone building seemed to glow by itself. Travellers sometimes called it the Lantern Tower, though it contained no lamp and had never guided a ship.

For generations, the people of Aven had been proud of this evening brightness. They placed it on postcards and painted it above the doors of inns. When dust from a distant fire dimmed the sky for several weeks, the tower remained grey. The villagers spoke as if something had been stolen from them.

Only Sori, the baker, objected. “The tower never owned the light,” she said. “It only knew how to receive it.”

Her remark sounded unpatriotic to some. Yet when the clear evenings returned, people began climbing the hill at sunset. From there, they saw that the tower’s famous radiance depended upon many things: the open western sky, the pale stone, the angle of the hillside, even the absence of tall trees. What had seemed like a single wonder was actually a meeting of conditions.

The villagers did not become less proud. Their pride merely changed shape. Instead of praising the tower for shining alone, they celebrated the landscape that allowed it to shine. The image on the postcards remained, but beneath it appeared a new line: “Aven—where the valley gathers light.”`,questions:[

]},
{title:"Passage 3 — The Patient Clock",text:`Mr Fen kept a clock in his workshop that was always seven minutes slow. Customers offered to repair it, tease him about it, or quietly adjust its hands when he was not looking. He thanked the repairers, ignored the teasers, and calmly moved the hands back whenever anyone corrected them.

The clock had belonged to the railway waiting room where Mr Fen’s mother worked. Each evening, the final train was scheduled for 8:10, but the station clock showed 8:03 when it arrived. The railway manager knew about the fault and promised for years to replace the clock. Meanwhile, passengers who trusted it sometimes hurried aboard at what they believed was the last moment, only to discover that they were early.

As a child, Mr Fen had imagined that his mother’s clock could create spare time. Seven unexpected minutes were enough for a goodbye, a forgotten parcel, or one more sentence in a story. When the station closed, his mother bought the clock at auction and later gave it to him.

Mr Fen knew perfectly well that a slow clock could make a person miss an appointment. He did not recommend inaccurate clocks to anyone. Yet in a workshop governed by measurements—where a fraction of a millimetre mattered—he allowed this single error to remain. It reminded him that time could be counted precisely without being experienced simply. Seven minutes on a timetable and seven minutes beside someone you love may be equal in length, but not in value.`,questions:[
["How inaccurate was the clock?",["Seven minutes fast","Seven minutes slow","One hour slow","It had stopped"],1],
["What did Mr Fen do after others corrected it?",["He thanked them and left it","He moved the hands back","He sold the clock","He called the manager"],1],
["Where had the clock originally been?",["A school hall","A railway waiting room","A bakery","A museum"],1],

["What time did the station clock show when it arrived?",["8:03","8:10","7:53","8:13"],0],
["What had the manager promised?",["To delay the train","To replace the clock","To hire Mr Fen","To close the station"],1],
["What happened to passengers who trusted the clock?",["They found they were early","They always missed the train","They complained about the fare","They arrived seven minutes late"],0],
["What did young Mr Fen imagine?",["The clock could create spare time","The railway controlled time","His mother repaired trains","The clock predicted arrivals"],0],
["What could seven minutes allow?",["A goodbye or one more sentence","A journey to another town","A complete new clock","A station to be built"],0],

["What does Mr Fen understand about slow clocks?",["They can cause missed appointments","They are more precise","Everyone should own one","They improve timetables"],0],
["Why is the clock especially striking in his workshop?",["His work normally requires exact measurement","There are no other clocks","Customers cannot see it","The workshop is at a station"],0],
["What does “this single error” refer to?",["A faulty measurement","The clock being seven minutes slow","The station closing","A missed parcel"],1],
["What distinction does the final paragraph make?",["Counted time and experienced time","Trains and workshops","Children and adults","Stories and timetables"],0],
["What does “equal in length, but not in value” mean?",["The same duration can feel more meaningful in one situation","Some minutes contain more seconds","Timetables measure time incorrectly","Love makes clocks run slowly"],0],
["The tone is best described as:",["Reflective and affectionate","Suspicious and bitter","Comic and frantic","Cold and technical"],0],
["Which theme is central?",["Memory can give an imperfect object meaning","Accuracy is never useful","Railways should avoid clocks","Childhood ideas are always correct"],0],

]}];

let p=0,q=0,answers=[],time=4800,submitted=false;
function timer(){const m=Math.floor(time/60),s=time%60;document.getElementById("timer").innerHTML="<h3>Time: "+m+":"+String(s).padStart(2,"0")+"</h3>";if(time>0&&!submitted){time--;setTimeout(timer,1000)}else if(!submitted)submitTest()}
function load(){document.getElementById("passage").innerHTML="<h2>"+data[p].title+"</h2>"+data[p].text;show()}
function show(){const item=data[p].questions[q];let html="<p><strong>"+item[0]+"</strong></p>";item[1].forEach((opt,i)=>{html+="<label><input type='radio' name='q' onclick='save("+i+")' "+(answers[p*20+q]===i?"checked":"")+"> "+opt+"</label>"});html+="<p>Question "+(p*20+q+1)+" of 60</p>";document.getElementById("q").innerHTML=html;document.getElementById("bar").style.width=((p*20+q+1)/60*100)+"%"}
function save(c){answers[p*20+q]=c}
function next(){if(q<19)q++;else if(p<2){p++;q=0;load();return}show()}
function prev(){if(q>0)q--;else if(p>0){p--;q=19;load();return}show()}
function submitTest(){if(submitted)return;submitted=true;let score=0,review="";data.forEach((pass,pi)=>pass.questions.forEach((qq,qi)=>{const idx=pi*20+qi,user=answers[idx],correct=qq[2];if(user===correct)score++;review+="<p><strong>Q"+(idx+1)+".</strong> "+qq[0]+"<br>Your: <span class='"+(user===correct?"correct":"wrong")+"'>"+(qq[1][user]||"None")+"</span><br>Correct: <span class='correct'>"+qq[1][correct]+"</span></p>"}));document.getElementById("score").innerHTML="<h2>Score: "+score+"/60</h2>";document.getElementById("review").innerHTML=review;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
timer();load();
</script>
