{title:"Passage 1 — The Garden Above Platform Six",text:`When the railway company announced that the flat roof above Platform Six would become a garden, Imani expected a few tubs of flowers. Instead, landscape designer Mr Sato arrived with rolls of silver matting, shallow wooden beds and a notebook full of calculations.

The roof could not safely carry deep soil, so Mr Sato planned to grow tough, light-rooted plants in a thin mixture of crushed brick and compost. Rainwater from the station canopy would be collected in a tank. Most surprising of all, the garden was not intended chiefly for passengers. It would provide a resting place for insects crossing the crowded centre of the city.

Imani joined the Saturday volunteer team. Her first job was to arrange stones around a small dish of water. She made a perfect circle, but Mr Sato gently scattered the stones. Butterflies, he explained, needed sloping edges where they could land without falling in. “Useful can look untidy,” he said.

During the first month, the roof seemed disappointing. The plants remained low, and no butterflies appeared. Several volunteers wanted to add bright greenhouse flowers. Mr Sato refused because those varieties produced little nectar and required more water. He asked the team to wait for the native thyme and marjoram to bloom.

In June, a heatwave turned the pavements below pale with dust. On the roof, the water tank ran low. Imani suggested watering every bed equally, but her notes showed that the shaded beds stayed damp twice as long. The team gave the remaining water only to the sunniest areas.

Three days later, Imani spotted an orange-tip butterfly. By lunchtime there were six, along with bees and a metallic green beetle. A station manager came upstairs carrying a complaint: passengers on a nearby office bridge thought the roof looked wild. Then he noticed the insects and tore up the paper.

By autumn, the garden had become one link in a chain of rooftop habitats across the city. Imani made a new sign for the platform below: “The shortest garden can still be part of a long journey.”`,questions:[

{title:"Passage 2 — The Midnight Loaf",text:`At eleven o'clock on Friday night, Theo tied on an apron at his aunt's bakery. The shop was closed, but the ovens still breathed warm air into the kitchen. Aunt Celia was preparing one hundred loaves for the harbour market, and Theo had begged to help.

His task was to weigh lumps of dough. Each should be exactly 500 grams before baking. Theo worked quickly, pleased by the tidy row he produced. Aunt Celia checked his scales and frowned. A smear of dough was stuck beneath the metal tray, adding twelve grams to every reading. Theo's neat portions were all too small.

There was no spare dough, so they could not simply start again. Aunt Celia showed Theo how to take a little from the heaviest pieces and add it to the lightest. “Accuracy isn't never making a mistake,” she said. “It's noticing one while it can still be corrected.”

Shortly after midnight, the electric mixer stopped. The lights remained on, which meant the building had power. Theo crouched beside the machine and heard a faint clicking. He wanted to remove the cover, but Aunt Celia unplugged the mixer first. Wrapped around its rear wheel was the loose end of a flour sack's string.

They freed the wheel, yet the mixer still would not turn. Theo noticed a small red button had popped out. A label beside it said OVERLOAD RESET. After the motor cooled, Aunt Celia pressed the button and the machine hummed again.

At two o'clock, rain began drumming on the skylight. Theo's arms ached, and the loaves waiting to enter the oven looked pale and unimpressive. Then the first batch emerged: rounded, brown and crackling softly as it cooled. The smell seemed to fill even the dark street.

At the market, one customer asked why some loaves were slightly longer than others. Theo waited for his aunt to apologise. Instead, she explained that each had been shaped by hand but contained the same weight of dough. The customer chose the most crooked loaf. “Then this one has the most character,” she said.

Theo finally understood that exactness and sameness were not identical. The scales had to be right; the shapes did not.`,questions:[

{title:"Passage 3 — The Museum of Small Sounds",text:`The town museum owned swords, portraits and a skeleton of a whale, but its newest exhibition began with the click of a kitchen light switch. Visitors entered a darkened room, put on headphones and selected sounds from a glowing map.

The idea belonged to fourteen-year-old Safa. While interviewing her grandfather for a history project, she discovered that he remembered his childhood home less through photographs than through noises: the rattle of the letterbox, a neighbour beating a rug, and milk bottles touching on the doorstep.

Safa asked the museum to collect everyday sounds before they vanished. Curator Mrs Wynn liked the proposal but saw a difficulty. Old sounds could not simply be recorded in the present. Few people still used coal chutes, mechanical typewriters or hand-operated water pumps.

They began by inviting residents to describe remembered noises. Then the museum borrowed surviving objects and recorded them in a studio. Safa insisted that each recording include silence before and after the sound. Without that space, she said, the noises felt like specimens pinned too tightly in a display case.

One recording caused an argument. A farmer brought in a brass handbell once used to call workers for lunch. In the studio its ring was sharp and clean. The farmer said it was wrong: outdoors, wind and distance had softened it. The team recorded the bell again in a field, but passing traffic could be heard.

Rather than remove the traffic with editing software, Safa kept both versions. Beside them she added a question: “Is a sound the object itself, or the place where it is heard?” Visitors voted by pressing one of two buttons, though many pressed both.

On opening day, Safa's grandfather listened to the milk bottles. His eyes closed before the sound had finished. “That was the milkman at half past six,” he said. The label gave no time, yet his memory had supplied one.

The most popular recording was not the loudest or oldest. It was the brief squeak of the wooden floor outside the former children's library. Hundreds of visitors recognised it. The exhibition showed Safa that a small sound could unlock a room no museum had space to rebuild.`,questions:[

let index=0,answers=Array(60),seconds=4800,submitted=false;
const $=id=>document.getElementById(id);
function render(){const pi=Math.floor(index/20),qi=index%20,p=data[pi],item=p.questions[qi];$("passage").innerHTML=`<h2>${p.title}</h2>${p.text}`;$("question").innerHTML=`<strong>Question ${index+1} of 60</strong><p>${item[0]}</p>`+item[1].map((x,i)=>`<label class="option"><input type="radio" name="answer" ${answers[index]===i?'checked':''} onchange="answers[${index}]=${i}"> ${x}</label>`).join('');$("bar").style.width=`${(index+1)/60*100}%`;$("prev").disabled=index===0;$("next").disabled=index===59;scrollTo({top:0,behavior:'smooth'})}
function move(n){index=Math.max(0,Math.min(59,index+n));render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;$("timer").textContent=`Time: ${m}:${String(s).padStart(2,'0')}`;if(seconds>0&&!submitted){seconds--;setTimeout(tick,1000)}else if(!submitted)submitTest(true)}
function submitTest(auto){if(submitted)return;const blank=answers.filter(x=>x===undefined).length;if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit anyway?`))return;submitted=true;let score=0,out='';data.forEach((p,pi)=>p.questions.forEach((q,qi)=>{const i=pi*20+qi,u=answers[i],ok=u===q[2];if(ok)score++;out+=`<article><strong>Q${i+1}. ${q[0]}</strong><br>Your answer: <span class="${ok?'correct':'wrong'}">${u===undefined?'Not answered':q[1][u]}</span><br>Correct answer: <span class="correct">${q[1][q[2]]}</span></article>`}));$("score").innerHTML=`<h2>Score: ${score}/60</h2><p>${auto?'Time expired — the test was submitted automatically.':`You answered ${60-blank} questions.`}</p>`;$("review").innerHTML=`<h2>Answer review</h2>${out}`;document.querySelectorAll('button,input').forEach(x=>x.disabled=true);$("score").scrollIntoView({behavior:'smooth'})}
