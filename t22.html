{title:"Passage 1 — The Flags of Gull Point",text:`For nearly a century, the signal hut at Gull Point had sent messages to ships using coloured flags. Radio made the hut unnecessary, and it became a tiny museum overlooking the harbour. When twelve-year-old Nia volunteered there, curator Mr Bell expected her to dust display cases. Instead, she asked why the flagpole was bare.

Mr Bell explained that the old cotton flags were too fragile for the wind. Nia proposed making replicas, but the museum owned no sewing machine. She studied photographs and noticed that the original flags were assembled from simple rectangles and triangles. With permission, she recruited the harbour craft club, whose members stitched heavy marine cloth by hand.

The first replica looked splendid indoors. Outside, however, it wrapped itself around the pole. Retired sailor Mrs Venn showed Nia a narrow wooden bar called a toggle. Fastened along the flag's top edge, it held the cloth open when the wind weakened.

Nia planned a demonstration for the summer fair. Visitors would decode three signals: WEATHER WORSENING, DOCTOR NEEDED and WELCOME HOME. She placed explanation cards beside the hut, but a gust carried two over the cliff rail. Rather than print heavier cards, Nia painted the code on flat stones. Their rough surfaces made the letters imperfect, yet they stayed put.

On fair morning, fog swallowed the harbour. The flags could barely be seen from the pier. Mr Bell suggested cancelling, but Nia moved the audience uphill, behind the hut. Against the pale fog, the flags appeared as sharp blocks of colour.

Halfway through, a visiting child arranged two flags incorrectly. They signalled KEEP CLEAR instead of WELCOME HOME. Nia did not correct him at once. She asked the crowd what the unexpected message meant and why accuracy mattered at sea.

By afternoon the fog lifted. A fishing boat entered the harbour, and its crew answered Nia's final signal with three blasts of its horn. The replica flags had not revived an obsolete system; they had made its logic visible. Mr Bell gave Nia a new museum job: not polishing history, but helping people read it.`,questions:[

{title:"Passage 2 — The Clockwork Seed Library",text:`The library in Alder Square lent more than books. In a tall cabinet beside the history shelves, it kept envelopes of bean, herb and flower seeds. Borrowers planted them, then returned seeds from the strongest plants after harvest.

One spring, librarian Mr Adey found that people were taking the newest packets while older seeds remained untouched. Since seeds gradually lose their ability to sprout, this threatened to waste much of the collection. Thirteen-year-old Tomas suggested copying the rotating shelves used in the bakery where his mother worked: older loaves always moved to the front.

Together they built a circular wooden rack. Turning a brass handle moved each seed drawer one position forward. A painted arrow marked the drawer to be borrowed next. Tomas called it the seed clock, although it measured no hours.

During testing, the rack jammed every seventh turn. Tomas blamed a crooked drawer, but Mr Adey placed a chalk dot on one gear tooth and turned the handle slowly. The jam always occurred when the marked tooth met a smaller wheel. A splinter was lodged between them. Removing it fixed the mechanism.

The machine created a different problem. Visitors treated the arrow as a command and took seeds unsuitable for their gardens. Balcony growers chose climbing beans they had nowhere to support. Tomas added coloured labels: blue for pots, green for shady ground and yellow for sunny beds. The arrow now indicated age; the labels indicated suitability.

At the launch, six-year-old Leni asked what happened if nobody wanted the oldest seeds. Tomas expected Mr Adey to answer. Instead, the librarian handed Leni a small tray. Unwanted seeds, he explained, would be tested on damp cloth. If enough sprouted, they would be offered again. If not, the packet would be replaced and its remaining seeds added to the compost.

By autumn, returns filled the cabinet. Some envelopes held fewer seeds than had been borrowed, but Mr Adey did not mind. The library was not a bank demanding interest. Its success was measured in healthy plants and shared knowledge.

Tomas engraved one sentence around the seed clock's handle: “Take the past forward, one turn at a time.”`,questions:[

{title:"Passage 3 — Lanterns in the Tide",text:`At low tide, the rocks below Northhaven looked black and ordinary. After sunset, marine biologist Dr Ko touched a pool with the tip of a paddle. Blue sparks swirled around it. The light came from microscopic plankton that flashed when the water moved.

Dr Ko's youth survey team had come to map where the glowing plankton gathered. Fourteen-year-old Elsie carried a waterproof grid map, while her partner Rafi held a meter that measured water temperature. They agreed to use only dim red torches because bright white light would spoil their night vision and make the glow harder to judge.

Their first pool shone brilliantly. Elsie marked it with the highest score, five. Rafi noticed that their boots had stirred the water before the observation. They waited until the pool became still, then disturbed it once with the paddle as required by the survey rules. The new score was only three. Elsie crossed out her first result rather than hiding the mistake.

Farther along the shore, they found two equally bright pools. One was warm and shallow; the other was cold and deep. This weakened Dr Ko's guess that warmer water alone produced stronger light. Elsie suggested that trapped seaweed might provide food for plankton. The team recorded the idea but did not call it a conclusion.

Near midnight, clouds covered the moon. The glow seemed suddenly brighter, although the plankton had not necessarily changed. Dr Ko stopped the survey. Scores made under a darker sky could not fairly be compared with earlier ones. While they waited, Rafi measured cloud cover by dividing the sky into eight imaginary sections.

When the moon returned, a wave filled several pools with fresh seawater. The team marked those sites with a star because their conditions had changed. They would not mix starred results with the original set.

The next week, Dr Ko displayed the map at the aquarium. The most useful marks were not the dramatic fives but the crossings-out, cloud notes and stars. They showed exactly where certainty ended.

Elsie had hoped the survey would explain the glowing tide. Instead, it taught her something more durable: careful observers do not merely collect wonders; they record the limits of what they know.`,questions:[
["What produced the blue sparks?",["Moonlight","Microscopic plankton","Fish scales","A hidden lamp"],1],["When were the rocks examined?",["At high tide at noon","At low tide after sunset","During sunrise","In a storm"],1],["What was the team's goal?",["To collect every plankton","To map where glowing plankton gathered","To photograph boats","To measure cliff height"],1],["What did Elsie carry?",["A waterproof grid map","A white lantern","A fishing net","A camera"],0],["What did Rafi measure?",["Wind speed","Water temperature","Rock age","Tide sound"],1],["Why were red torches used?",["To preserve night vision","To warm the pools","To attract fish","To signal boats"],0],["What was Elsie's first score?",["Two","Three","Five","Eight"],2],["Why was that score unreliable?",["Boots had already stirred the pool","The paddle broke","The map was wet","The water froze"],0],["What score followed the standard test?",["One","Three","Four","Five"],1],["What did Elsie do with the mistaken score?",["Hid it","Crossed it out","Changed the rules","Blamed Rafi"],1],["What challenged Dr Ko's temperature guess?",["Equally bright pools had different temperatures","All pools were cold","The meter failed","Clouds warmed the shore"],0],["What possible factor did Elsie suggest?",["Trapped seaweed","Red torchlight","Boot colour","Rock shape"],0],["Why was her idea not called a conclusion?",["It was only a possibility needing evidence","Dr Ko disliked seaweed","The survey had ended","Rafi disproved it"],0],["What happened when clouds covered the moon?",["The apparent glow brightened","The tide vanished","The pools dried","The plankton stopped"],0],["Why did Dr Ko pause the survey?",["Comparisons would be unfair under different darkness","Everyone was tired","The torches failed","A boat arrived"],0],["How did Rafi estimate cloud cover?",["Using eight imaginary sky sections","Counting stars","Measuring rainfall","Watching a clock"],0],["Why were some pools marked with stars?",["A wave changed the dossier("Passage 1 — The Lighthouse That Listened",`The lighthouse on Morrow Island had not guided a ship for thirty years, yet every autumn its empty tower seemed to hum. Islanders blamed the wind. Eleven-year-old Suri, helping caretaker Mr Ives catalogue the building, noticed that the sound began even on still evenings.

She climbed the spiral stair and held a paper ribbon beside each window. None moved. Near the lantern room, however, the ribbon trembled above an iron speaking tube once used to call down to the keeper's kitchen. Suri asked Mr Ives not to seal it until they understood why.

At low tide they followed the tube through a wall and into a narrow sea cave. Waves pushed air into the cave, forcing it along the pipe. A loose brass cap at the top vibrated like the reed of an instrument. The hum arrived several seconds after each distant wave struck.

For the island's open day, Suri built a display with a shallow tray of water, a rubber bulb and a clear tube. Squeezing the bulb made the water ripple, showing how pressure could travel where visitors could not see it. When a child squeezed too hard, the tube sprang loose and splashed the mayor. Suri added a clamp and marked a safe line on the bulb.

Mr Ives kept the old cap, but placed a soft mesh over the cave entrance so nesting birds could not enter the pipe. The lighthouse had not been haunted or silent. It had simply been listening to the sea in a language no one had paused to investigate.`,[

dossier("Passage 2 — The Orchard of Paper Birds",`In Bellweather School's old orchard, no apple had grown for years. The trees blossomed each spring, then dropped their flowers. Groundskeeper Mara suspected a lack of pollinating insects, but the eco-club wanted evidence before buying new hives.

Twelve-year-old Dev proposed tying small paper birds to selected branches. A blue bird marked a flower cluster left open to insects; a red bird marked one covered with fine mesh. The mesh allowed light and rain through but kept larger insects away. Each pair grew on the same tree so differences in soil and shade would matter less.

After a week, several red markers vanished. Dev first blamed the crows. Then he found soggy paper beneath the trees: overnight rain had dissolved the paste. The club replaced every marker with painted wooden shapes and recorded which results had become uncertain.

When petals fell, the open clusters formed more tiny fruit than the covered ones. This supported Mara's idea, but Dev warned that the mesh might also have altered warmth or airflow. The club repeated the test using loose mesh cages that left more space around the blossom.

The second trial showed the same pattern. Instead of importing hives immediately, the school planted lavender, thyme and native wildflowers beside the orchard to feed local insects across a longer season. By autumn, only seven apples had ripened. Some pupils called that a failure. Mara sliced the apples into enough thin crescents for everyone to taste. The harvest was small, she said, but the orchard had begun to repair the relationships on which a harvest depends.`,[

dossier("Passage 3 — A Train for the Stars",`The hill observatory received a heavy new mirror just before winter. The road to its dome was too steep for the delivery lorry, and carrying the mirror by hand risked scratching its silvered surface. In a storage shed, technician Jo found the rusted track of a miniature railway once used to move coal.

Fourteen-year-old Malik mapped the track and discovered that one curve leaned outward. A marble rolled across it would jump the rail. Rather than straighten the historic track, the team built a low wagon with independently turning wheels and a padded cradle. Sandbags matching the mirror's weight were used for trials.

On the first run, the wagon stopped halfway uphill. Grease had hardened in the cold. Jo suggested heating the axle, but Malik worried that uneven warmth could bend the metal. They cleaned away the old grease and applied a lubricant designed for low temperatures.

The second run reached the dome, although a cup of water in the cradle showed sharp ripples at every rail joint. Felt beneath the cradle softened the vibration, while chalk marks on the track told the pullers where to slow down. The real mirror then travelled uphill at walking pace beneath a waterproof cover.

That night, astronomer Dr Sen aimed the restored telescope at a faint comet. Malik expected praise for the clever wagon. Instead, Dr Sen thanked the team for moving slowly. In astronomy, she explained, the grandest views often depend on ordinary acts of patience that leave no mark on what they protect.`,[
["What had to be moved uphill?","A telescope mirror"],["Why could the lorry not deliver it?","The road was too steep"],["What old system did Jo find?","A miniature railway track"],["How did Malik test the leaning curve?","With a rolling marble"],["What was used before the real mirror?","Sandbags of equal weight"],["Why did the wagon first stop?","Grease had hardened"],["Why was heating rejected?","It might bend the axle"],["What revealed vibration?","Ripples in a cup of water"],["What reduced the vibration?","Felt beneath the cradle"],["What is the passage's central lesson?","Patient care enables remarkable achievements"]])
