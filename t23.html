<!doctype html>
<html lang="en">
<head>

<title>Reading Test - 11+ (T23)</title>
<style>
:root{--ink:#172033;--blue:#2563eb;--pale:#eff6ff;--line:#dbe3ef;--good:#15803d;--bad:#b91c1c;--gold:#f59e0b}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf2ff,#f8fafc);margin:0;padding:20px;color:var(--ink)}main{max-width:1080px;margin:auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 12px 35px #1e3a5f18}.top,.meta,.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:.2em 0}.badge{background:var(--pale);padding:7px 11px;border-radius:99px;font-weight:700}.passage{background:#fbfdff;padding:22px;border-left:6px solid var(--blue);white-space:pre-line;line-height:1.85;margin:18px 0;border-radius:8px}.question{padding:18px;border:1px solid var(--line);border-radius:12px}.option{display:block;padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:9px;cursor:pointer}.option:hover{background:var(--pale)}button{background:var(--ink);color:#fff;padding:11px 17px;border:0;border-radius:9px;cursor:pointer;font-weight:700}button.primary{background:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}.progress{height:9px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .2s}.small{font-size:14px;color:#526078}.correct{color:var(--good)}.wrong{color:var(--bad)}#score{margin-top:20px;padding:1px 18px;background:var(--pale);border-radius:12px}#review article{padding:12px 0;border-bottom:1px solid var(--line)}
</style></head>
<body><main>
<div class="top"><h1>Reading Test (11+) — T23</h1><span class="badge">80 minutes</span></div>
<div class="meta"><strong id="timer">Time: 80:00</strong><span class="small">3 passages • 20 questions each • 60 total</span></div>
<p class="small">Read closely. You may move backwards and forwards before submitting.</p><div class="progress"><span id="bar"></span></div>
<section id="passage" class="passage"></section><section id="question" class="question"></section>
<div class="nav" style="margin-top:16px"><div><button id="prev" onclick="move(-1)">Previous</button> <button class="primary" id="next" onclick="move(1)">Next</button></div><button onclick="submitTest(false)">Submit test</button></div>
<div id="score"></div><div id="review"></div>
</main><script>
const data=[{"title":"Passage 1 — The Garden Beneath the Glass","text":"When Leila first saw the abandoned greenhouse behind her school, half its panes were cloudy and ivy had forced its way through the door. Inside, however, the air felt strangely warm. Mr Okoro, the caretaker, explained that pipes beneath the floor once carried heat from a spring deep underground. The system had been disconnected years ago when a valve cracked.\n\nLeila's science club wanted to grow vegetables for the community kitchen, but winter heating would cost more than the club could afford. She wondered whether the old system could work again. Rather than touching the rusted machinery, the pupils found the original plans in the school archive and invited an engineer, Dr Shah, to inspect it.\n\nDr Shah discovered that most of the pipes were sound. The broken valve was important, but replaceable. She explained that underground water was heated naturally by rocks. It could warm the greenhouse without being used for drinking, then return underground through a second pipe. The pump would still need electricity, so the system was not entirely free.\n\nThe club raised money with a seed sale. During repairs, they cleaned the glass and built narrow beds from reclaimed timber. In January, when frost silvered the playing field, the greenhouse held rows of spinach and herbs. Sensors showed that its temperature stayed steady even after sunset.\n\nAt first, Leila called the project a return to an old idea. Dr Shah disagreed gently. The original builders had released used water into a ditch; the restored system returned it underground. “Good inventions can be improved when we understand their consequences,” she said.\n\nBy spring, the kitchen was receiving a basket of produce each week. Beside the greenhouse door, the club displayed the old plans next to their new diagram. The two drawings looked similar, but the arrows at the end pointed in different directions.","questions":[["Why did the greenhouse feel warm?",["Sunlight entered through new glass","Pipes had once carried underground heat","A heater had been left on","Ivy covered the walls"],1],["What had damaged the old system?",["A cracked valve","A broken window","A blocked chimney","A flooded bed"],0],["Why did the club need another source of heat?",["Winter heating was too expensive","Plants needed darkness","The kitchen had closed","The school banned electricity"],0],["What did the pupils do before touching the machinery?",["They planted spinach","They found plans and invited an engineer","They emptied the spring","They removed every pipe"],1],["Who inspected the system?",["Mr Okoro","Leila","Dr Shah","The cook"],2],["What did Dr Shah find about most pipes?",["They were sound","They were missing","They carried drinking water","They were made of wood"],0],["What naturally heated the underground water?",["Electric pumps","The sun","Rocks","Plant roots"],2],["Why was the system not entirely free?",["It needed an electric pump","The water had to be bought","The herbs were imported","The glass was rented"],0],["How did the club raise money?",["A seed sale","A concert","A grant from the kitchen","Selling the plans"],0],["What material was reused for the beds?",["Glass","Stone","Timber","Copper"],2],["What covered the playing field in January?",["Ivy","Frost","Spinach","Rainwater"],1],["What did the sensors show?",["The temperature remained steady","The pump stopped at sunset","The water was drinkable","The glass became colder"],0],["How did the restored design improve the original?",["It returned used water underground","It used a larger ditch","It removed all valves","It heated the playing field"],0],["What does “consequences” mean here?",["Results of an action","Parts of a machine","Historical drawings","Types of vegetable"],0],["How often did the kitchen receive produce by spring?",["Every day","Twice a year","Each week","Only once"],2],["Why were two diagrams displayed?",["To show how the design had changed","To advertise an art contest","To hide the old plans","To explain seed prices"],0],["What is suggested by the arrows pointing differently?",["The water ended in a different place","The greenhouse moved","The pipes were shorter","The spring changed direction"],0],["Leila is best described as:",["Curious and responsible","Reckless and impatient","Uninterested and lazy","Secretive and selfish"],0],["Which theme is central?",["Old ideas can be improved sustainably","Every old machine should be discarded","Vegetables grow without warmth","Archives are more useful than engineers"],0],["Which is the best summary?",["A club safely restores and improves geothermal heating to grow food","Pupils discover a hot drinking spring","An engineer closes a dangerous greenhouse","A kitchen replaces vegetables with herbs"],0]]},{"title":"Passage 2 — The Clock That Waited","text":"In the entrance hall of Bellford Library stood a tall clock that had not chimed for forty years. A brass plate named its maker as Jonah Bell, 1876. When the library prepared an exhibition about the town's craftspeople, apprentice conservator Tom was asked to examine it.\n\nTom expected a snapped spring. Instead, he found a strip of folded paper wedged beside the pendulum. On it, someone had written, “Please do not force the hands. The clock is waiting for the station.” The message sounded like a riddle, but Tom photographed it before moving anything.\n\nOld newspapers revealed that Bellford once set its public clocks by a signal sent from the railway station at noon. Jonah Bell's clock had contained a small electrical device that corrected its hands. When the station closed in 1964, the signal stopped. A librarian had apparently halted the clock rather than let it show unreliable time.\n\nTom could have installed a modern radio receiver, but that would erase part of the clock's story. With his supervisor, he designed a removable device that imitated the old noon signal without drilling new holes. The original mechanism remained untouched, and future conservators could remove the addition.\n\nOn the exhibition's opening day, townspeople gathered beneath the clock. At twelve, a quiet click came from inside the case. The minute hand straightened, and twelve clear notes filled the hall. An elderly visitor, Mrs Reed, laughed because she remembered being told to hurry home when she heard that sound as a child.\n\nTom added the folded note to the display. He had repaired more than a clock: he had restored a connection between a building, a vanished station and the people who once planned their day by both.","questions":[["Where did the clock stand?",["At the railway station","In Bellford Library","In Tom’s workshop","In Mrs Reed’s home"],1],["How long had it been silent?",["Four years","Fourteen years","Forty years","A century"],2],["Who made the clock?",["Tom","Jonah Bell","Mrs Reed","The librarian"],1],["What was Tom training to be?",["A driver","A conservator","A journalist","A stationmaster"],1],["What did Tom expect to find?",["A snapped spring","A hidden key","A radio receiver","A brass plate"],0],["Where was the folded note?",["Under the library door","Beside the pendulum","Inside a newspaper","Behind the station clock"],1],["Why did Tom photograph the note first?",["To record evidence before disturbing it","To sell the photograph","To read it in brighter light","To send it to Mrs Reed"],0],["How were public clocks once corrected?",["By a noon railway signal","By church bells","By sunlight","By radio"],0],["When did the station close?",["1876","1940","1964","On opening day"],2],["Why had a librarian probably stopped the clock?",["Its time could no longer be trusted","Its chime was too loud","The spring had snapped","The clock belonged to the station"],0],["What modern part did Tom decide not to install?",["A pendulum","A radio receiver","A minute hand","A brass plate"],1],["Why was the new device removable?",["To preserve the original clock for the future","To make it chime more loudly","To hide it from visitors","To reduce the exhibition time"],0],["What happened just before the clock chimed?",["A quiet click sounded","The station reopened","The hands were forced","The lights went out"],0],["Why did Mrs Reed laugh?",["The sound recalled her childhood","The clock showed the wrong time","Tom told a joke","She had written the note"],0],["What did the chime once tell her to do?",["Catch a train","Hurry home","Open the library","Wind the clock"],1],["What does “vanished” mean here?",["No longer existing","Newly painted","Difficult to hear","Moved upstairs"],0],["What does Tom’s solution show?",["Repairs can respect historical evidence","Modern technology is always harmful","Old clocks cannot be accurate","Exhibitions should be silent"],0],["Tom is best described as:",["Careful and thoughtful","Hasty and boastful","Fearful and confused","Careless and stubborn"],0],["Which theme is central?",["Objects can connect people with shared history","Libraries should replace railway stations","Riddles always conceal treasure","Time matters only at noon"],0],["Which is the best summary?",["Tom investigates a silent clock and restores its historic function without damaging it","Tom builds a new station clock","A visitor discovers a snapped spring","The library removes an unreliable clock"],0]]},{"title":"Passage 3 — Footprints After Dark","text":"The beach looked empty when Noah arrived, yet the sand was covered with messages. A warden named Imani showed his volunteer group a trail of tiny prints leading from the dunes to the sea. They belonged to newly hatched turtles, though no turtles remained in sight.\n\nThe group was taking part in a night survey. Their task was to count nests, record tracks and remove litter without disturbing the animals. White torches were forbidden because bright light could confuse hatchlings, which usually find the sea by following the pale horizon. Each volunteer wore a dim red lamp instead.\n\nNear the boardwalk, Noah noticed one set of tracks turning inland. A seaside café had left a decorative lamp shining towards the dunes. He wanted to pick up the hatchling immediately, but Imani told everyone to stand still. First they switched off the lamp with the owner's permission. Then they watched. A small turtle emerged from beneath a bench, paused, and turned towards the sea.\n\nNoah was surprised that doing less had helped more. Imani explained that rescuers sometimes create new problems by handling wild animals unnecessarily. Intervention was essential when an animal was trapped or injured, but in this case removing the false signal allowed the hatchling's own instincts to guide it.\n\nThe following afternoon, the café owner fitted a shield around the lamp so its glow pointed downwards. She also placed a notice on each table explaining why the shore became darker during nesting season. Customers began asking questions, and several returned for the next litter-picking event.\n\nAt the end of the week, Noah entered the survey results into a shared map. One set of footprints was too small to change the numbers significantly, but it had changed the way he understood helping: sometimes the best assistance clears an obstacle and then leaves room for nature to act.","questions":[["What covered the apparently empty beach?",["Seaweed","Messages in the form of tracks","Fishing nets","Café tables"],1],["Where did the tiny prints lead?",["From sea to café","From dunes to sea","From boardwalk to road","From rocks to dunes"],1],["Who led the volunteers?",["Noah","The café owner","Imani","A tourist"],2],["What were volunteers asked to record?",["Tracks and nests","Customer names","Tide temperatures only","Types of café food"],0],["Why were white torches forbidden?",["They might confuse hatchlings","Their batteries were costly","They attracted customers","They damaged the sand"],0],["What kind of light did volunteers use?",["Blue lamps","Dim red lamps","Candles","No light at all"],1],["What unusual thing did Noah notice?",["Tracks turning inland","A nest in the café","A broken boardwalk","A turtle flying"],0],["What caused the turtle to go the wrong way?",["A decorative café lamp","The red lamps","A shared map","A litter bin"],0],["Why did Imani tell the group to stand still?",["To avoid unnecessary interference","To count the volunteers","To wait for sunrise","To photograph the café"],0],["What did they do first?",["Picked up the turtle","Switched off the lamp with permission","Closed the café","Moved the bench"],1],["Where had the turtle been?",["Under a bench","Inside a nest box","Behind the dunes","On a table"],0],["What guided it after the lamp was off?",["Its own instincts","Noah’s footprints","A white torch","The café owner"],0],["When would direct intervention be essential?",["When an animal was trapped or injured","Whenever tracks were visible","When customers asked questions","Every night"],0],["How did the owner change the lamp?",["She shielded it to point down","She painted it red","She moved it into the sea","She made it brighter"],0],["Why did she put notices on tables?",["To explain darker shores during nesting season","To advertise turtle food","To recruit café staff","To show survey scores"],0],["How did some customers respond?",["They joined a later litter pick","They demanded brighter lights","They removed the notices","They avoided the beach"],0],["What did Noah do with the results?",["Entered them into a shared map","Posted them to the station","Buried them in the dunes","Gave them only to the café"],0],["What does “intervention” mean here?",["Action taken to change a situation","A type of footprint","A nesting season","A decorative light"],0],["Which lesson did Noah learn?",["Helping can mean removing an obstacle and stepping back","Wild animals should always be handled","One footprint changes all statistics","Beaches must stay closed"],0],["Which is the best summary?",["Volunteers remove misleading light, allowing a hatchling to find the sea and inspiring safer habits","Noah carries an injured turtle to a café","A survey proves red lamps harm wildlife","The café closes during nesting season"],0]]}];
let index=0,answers=Array(60),seconds=4800,submitted=false;
const $=id=>document.getElementById(id);
function render(){const pi=Math.floor(index/20),qi=index%20,p=data[pi],item=p.questions[qi];$("passage").innerHTML=`<h2>${p.title}</h2>${p.text}`;$("question").innerHTML=`<strong>Question ${index+1} of 60</strong><p>${item[0]}</p>`+item[1].map((x,i)=>`<label class="option"><input type="radio" name="answer" ${answers[index]===i?'checked':''} onchange="answers[${index}]=${i}"> ${x}</label>`).join('');$("bar").style.width=`${(index+1)/60*100}%`;$("prev").disabled=index===0;$("next").disabled=index===59;scrollTo({top:0,behavior:'smooth'})}
function move(n){index=Math.max(0,Math.min(59,index+n));render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;$("timer").textContent=`Time: ${m}:${String(s).padStart(2,'0')}`;if(seconds>0&&!submitted){seconds--;setTimeout(tick,1000)}else if(!submitted)submitTest(true)}
function submitTest(auto){if(submitted)return;const blank=answers.filter(x=>x===undefined).length;if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit anyway?`))return;submitted=true;let score=0,out='';data.forEach((p,pi)=>p.questions.forEach((q,qi)=>{const i=pi*20+qi,u=answers[i],ok=u===q[2];if(ok)score++;out+=`<article><strong>Q${i+1}. ${q[0]}</strong><br>Your answer: <span class="${ok?'correct':'wrong'}">${u===undefined?'Not answered':q[1][u]}</span><br>Correct answer: <span class="correct">${q[1][q[2]]}</span></article>`}));$("score").innerHTML=`<h2>Score: ${score}/60</h2><p>${auto?'Time expired — the test was submitted automatically.':`You answered ${60-blank} questions.`}</p>`;$("review").innerHTML=`<h2>Answer review</h2>${out}`;document.querySelectorAll('button,input').forEach(x=>x.disabled=true);$("score").scrollIntoView({behavior:'smooth'})}
tick();render();
</script></body></html>
