<style>
:root{--ink:#16213a;--muted:#63708a;--paper:#fffdf8;--line:#ddd4c5;--accent:#a6452d;--soft:#f4eee4;--ok:#18794e;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:#e9e4da;color:var(--ink);font-family:Georgia,"Times New Roman",serif}.shell{max-width:1100px;margin:28px auto;background:var(--paper);box-shadow:0 15px 45px #3e34241c;border:1px solid #d8d0c2}.mast{padding:28px 34px 22px;border-bottom:3px double var(--line)}h1{font-size:clamp(28px,5vw,48px);margin:0;letter-spacing:-.035em}.kicker{font:700 12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.meta{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-top:14px;font:14px Arial,sans-serif;color:var(--muted)}#timer{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}.progress{height:5px;background:#e6dfd3}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);min-height:590px}.passage{padding:34px;border-right:1px solid var(--line);line-height:1.82;font-size:18px;white-space:pre-line}.passage h2{font-size:28px;line-height:1.15;margin:0 0 18px}.quiz{padding:34px;display:flex;flex-direction:column}.eyebrow{font:700 12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}#q{flex:1}#q>p:first-child{font-size:20px;line-height:1.45;margin:16px 0 22px}label{display:block;margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;line-height:1.35;cursor:pointer;background:#fff;transition:.15s}label:hover{border-color:var(--accent);background:#fffaf3}input{margin-right:8px;accent-color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:white;padding:10px 15px;font:700 13px Arial,sans-serif;cursor:pointer}button.secondary{background:transparent;color <body>
<main class="shell">
  <header class="mast"><div class="kicker">Independent practice paper • Series T18</div><h1>Reading Comprehension</h1><div class="meta"><span>3 passages · 20 questions each · 60 questions total</span><span id="timer" aria-live="polite">Time remaining 80:00</span></div></header>

const data=[
{title:"Passage 1 — The Map in the Window",text:`Each evening, after the bakery closed, Mara arranged the unsold loaves in its front window. She did not stack them by size or price. Instead, she placed dark rye beside pale rolls, curved baguettes around round buns, and tiny seeded loaves at the edges. From the pavement, the display looked like an unusual map.

At first, people thought the arrangement was decorative. Then a delivery driver recognised the bend of the river in a row of baguettes. The round buns marked the town squares, while the rye loaves showed the wooded hills. Every night Mara made a different district, using only bread that would be donated to the morning shelter.

Nine-year-old Sami began stopping on his way home. He copied each display into a notebook and joined the pages together. Some areas were missing because Mara had not yet mapped them. Others overlapped. Sami did not mind. “Real exploring is untidy,” he said.

One wet Tuesday, the bakery window was empty. A note explained that the oven had broken. Sami hurried home and returned with his notebook. He opened it across the window from the inside, pressing the pages against the glass. Passers-by paused beneath their umbrellas to study the paper town.

When the oven was repaired, Mara resumed her bread maps, but she left one corner of the window clear. There Sami displayed a small card: “If you know a path we have missed, draw it here.” Soon the card was surrounded by scraps showing alleys, footbridges and shortcuts. The map had begun as Mara’s arrangement, but it became the town’s account of itself.`,questions:[
["What did Mara arrange after the bakery closed?",["Unsold loaves","Delivery boxes","Paper maps","Empty trays"],0],["How did the display look from the pavement?",["Like a menu","Like an unusual map","Like a forest","Like a clock"],1],["What did the baguettes represent?",["The river","The squares","The hills","The alleys"],0],["What did the rye loaves show?",["Footbridges","Town squares","Wooded hills","The bakery"],2],["What happened to the bread afterwards?",["It was thrown away","It was donated to a shelter","Sami took it home","It stayed in the window"],1],["Why did Sami carry a notebook?",["To list bread prices","To copy the displays","To record the weather","To draw cakes"],1],["What did Sami do with his pages?",["Sold them","Joined them together","Gave them to the driver","Baked them"],1],["Why were some areas absent?",["Mara had not mapped them yet","Sami erased them","The town had no streets","Rain destroyed every page"],0],["What does “Real exploring is untidy” suggest?",["Discovery does not always follow a neat plan","Maps should be dirty","Explorers dislike notebooks","The bakery was badly organised"],0],["Why was the window empty on Tuesday?",["The bakery had moved","The oven had broken","Mara was mapping another town","All the bread was sold"],1],["How did Sami respond?",["He complained to Mara","He displayed his notebook pages","He repaired the oven","He went to the shelter"],1],["Why did passers-by pause?",["To shelter inside","To study the paper town","To buy wet bread","To read the bakery menu"],1],["What changed after the oven was repaired?",["Mara stopped making maps","A corner was reserved for contributions","Sami stopped visiting","Only rye bread was used"],1],["What did Sami’s card invite people to add?",["Bread recipes","Missing paths","Shop prices","Weather reports"],1],["Which routes did people contribute?",["Motorways and railways","Alleys, footbridges and shortcuts","Rivers and hills only","Foreign sea routes"],1],["In context, “account” most nearly means:",["Bill","Description or record","Bank arrangement","Excuse"],1],["Which quality does Sami show most clearly?",["Resourcefulness","Jealousy","Carelessness","Impatience"],0],["How does the map develop?",["From one person’s design into a shared community record","From accurate to useless","From paper into bread","From a town map into a world atlas"],0],["The passage mainly celebrates:",["Waste and disorder","Shared observation and local knowledge","Professional map-making","Competition between neighbours"],1],["Which is the best summary?",["Mara’s bread displays inspire Sami and the town to build a collaborative map of overlooked routes","A driver teaches a baker to arrange bread by price","Sami opens a bakery after an oven fails","Townspeople replace all maps with bakery windows"],0]
]},
{title:"Passage 2 — The Borrowed Hour",text:`The clock in the station waiting room was always seven minutes fast. Commuters knew this and silently subtracted seven as they hurried beneath it. Visitors, however, often ran for trains that were not about to leave.

When the station was renovated, an engineer called Priya replaced the clock’s mechanism. For one morning it showed the correct time. The result surprised her: several regular passengers missed their trains. They had grown used to seeing the late-looking clock and had stopped performing the subtraction carefully. Its mistake had become part of their routine.

The station manager wanted the clock returned to its familiar error. Priya refused. A public clock, she argued, should be dependable, not merely predictable. But she also noticed that the seven hurried minutes had a strange effect. People bought tickets promptly, said brief goodbyes and reached the platforms early. The inaccurate clock lent them urgency.

Priya proposed a compromise. She kept the hands accurate but fitted a narrow ring around the clock face. At each minute, the ring showed a second number seven places ahead. A brass label beneath it read: “Time now; time to be ready.”

Travellers laughed at first. Soon, though, they used the inner numbers to check the present and the outer ones to plan. The station had not gained extra minutes. It had gained two honest ways of thinking about the same hour: one for where people were, and one for where they needed to be.`,questions:[

ticket price"],1],["What did the brass label distinguish?",["Home time and station time","Time now and time to be ready","Summer and winter","Arrivals and departures"],1],["How did travellers react at first?",["They laughed","They protested","They missed every train","They removed the ring"],0],["Did the design create extra time?",["Yes, seven minutes","Yes, one hour","No","Only for visitors"],2],["What contrast structures the ending?",["Past and future stations","Where people are and where they need to be","Visitors and engineers","Tickets and trains"],1],["Which idea is central?",["A useful system can separate accurate information from helpful planning","Public clocks should always run fast","Mistakes are more truthful than facts","Commuters should never form routines"],0],["Which is the best summary?",["Priya replaces a misleading clock with a design that shows both exact time and a useful readiness target","A manager removes a station clock after passengers complain","Priya deliberately delays trains by seven minutes","Visitors teach commuters how to subtract"],0]
]},
{title:"Passage 3 — The Winter Orchestra",text:`In the coldest week of January, the reeds beside Lake Orin made music. Wind crossed their hollow stems and produced thin whistles, low hums and sudden bright notes. Most walkers heard only a restless hiss. Elias, who tuned instruments for the town orchestra, heard separate voices.

He returned with lengths of coloured thread. Without cutting or bending the reeds, he tied a different colour near each stem that sounded a clear note. Blue marked the lowest, then green, yellow and red. By sunset, the shore looked as if small flags had flowered in the frost.

The next morning, many threads lay on the ground. Elias blamed the wind until he noticed tiny footprints in the mud. Field mice had carried some threads to line their nests. He considered tying them more firmly, but decided that warm nests mattered more than his system.

Instead, Elias drew the positions of the reeds on a folded map and marked their notes in pencil. A group of children helped him listen. They discovered that the music altered as ice formed at the water’s edge and changed again when snow softened the wind. The reeds were not a fixed instrument. Weather was always retuning them.

At the spring concert, Elias’s orchestra performed a short piece based on the lake’s winter sounds. He did not try to imitate every whistle. He left spaces between phrases, remembering how much of the lakeside music had depended on waiting. In the front row, each child held a small square of coloured thread.`,questions:[
["When did the reeds make music?",["During the coldest week of January","At the spring concert only","Every summer evening","After Elias cut them"],0],["What caused the sounds?",["Mice moving stems","Wind crossing hollow reeds","Children blowing whistles","Ice cracking"],1],["What was Elias’s occupation?",["He repaired clocks","He tuned instruments","He mapped roads","He studied mice"],1],["How did most walkers describe the sound?",["A full orchestra","A restless hiss","Complete silence","A loud drumbeat"],1],["What did Elias hear that others did not?",["Separate voices","Spoken words","A train","Bird calls"],0],["Why did Elias use coloured thread?",["To decorate the lake","To mark reeds by their notes","To trap field mice","To strengthen the stems"],1],["Which colour marked the lowest notes?",["Red","Yellow","Green","Blue"],3],["What happened overnight?",["The lake dried up","Many threads fell or were taken","All reeds broke","The notes became identical"],1],["What evidence pointed to mice?",["Tiny footprints","Chewed reeds","A visible nest in every stem","Loud squeaking"],0],["Why did Elias not tie the threads more firmly?",["He had no thread left","He valued the mice’s warm nests more than his system","The children objected","The reeds were too tall"],1],["What did Elias use instead?",["A folded map with pencil marks","Metal labels","A recording machine","Paint on the reeds"],0],["Who helped him listen?",["Orchestra conductors","A group of children","Station commuters","Lake fishermen"],1],["What changed the reed music?",["Only the time of day","Ice, snow and wind conditions","The coloured threads alone","The children’s voices"],1],["What does “Weather was always retuning them” imply?",["The reeds’ sounds changed with conditions","The reeds were repaired daily","The weather played one fixed tune","Elias controlled the climate"],0],["What happened at the spring concert?",["The reeds were carried indoors","The orchestra played a piece inspired by the lake","The mice performed","Elias showed only his map"],1],["Why did the piece include spaces?",["Musicians forgot notes","Waiting was part of the original listening experience","The concert was too long","The instruments were broken"],1],["What did each child hold?",["A reed","A map","A square of coloured thread","A pencil"],2],["Which trait best describes Elias?",["Attentive and adaptable","Wasteful and stubborn","Noisy and impatient","Secretive and dishonest"],0],["Which theme is most important?",["Careful listening reveals patterns, but nature remains changeable","Nature should be organised permanently","Animals always ruin scientific work","Music requires expensive instruments"],0],["Which is the best summary?",["Elias studies changing reed sounds, adapts his method to protect mice, and turns attentive winter listening into music","Elias cuts lake reeds to build instruments for children","An orchestra frightens mice away from a frozen lake","Walkers repair reeds damaged by snow"],0]
]}
];
let p=0,q=0,answers=Array(60),time=4800,submitted=false;
const $=id=>document.getElementById(id);
function timer(){const m=Math.floor(time/60),s=time%60;$('timer').textContent=`Time remaining ${m}:${String(s).padStart(2,'0')}`;if(time>0&&!submitted){time--;setTimeout(timer,1000)}else if(!submitted)submitTest()}
function load(){const pass=data[p];$('passage').innerHTML=`<h2>${pass.title}</h2>${pass.text}`;show()}
function show(){const item=data[p].questions[q],idx=p*20+q;$('position').textContent=`Passage ${p+1} · Question ${idx+1} of 60`;$('q').innerHTML=`<p><strong>${item[0]}</strong></p>`+item[1].map((opt,i)=>`<label><input type="radio" name="q" ${answers[idx]===i?'checked':''} onchange="save(${i})">${opt}</label>`).join('');$('bar').style.width=`${(idx+1)/60*100}%`}
function save(choice){answers[p*20+q]=choice}
function next(){if(q<19)q++;else if(p<2){p++;q=0;load();window.scrollTo({top:0,behavior:'smooth'});return}show()}
function prev(){if(q>0)q--;else if(p>0){p--;q=19;load();window.scrollTo({top:0,behavior:'smooth'});return}show()}
function submitTest(){if(submitted)return;submitted=true;let score=0,review='';data.forEach((pass,pi)=>pass.questions.forEach((item,qi)=>{const idx=pi*20+qi,user=answers[idx],correct=item[2],ok=user===correct;if(ok)score++;review+=`<p><strong>Q${idx+1}. ${item[0]}</strong><br>Your answer: <span class="${ok?'correct':'wrong'}">${user===undefined?'Not answered':item[1][user]}</span><br>Correct answer: <span class="correct">${item[1][correct]}</span></p>`}));$('score').innerHTML=`<h2>Score: ${score} / 60</h2><p>${answers.filter(v=>v!==undefined).length} questions answered.</p>`;$('review').innerHTML=review;$('results').classList.remove('hidden');$('results').scrollIntoView({behavior:'smooth'})}
timer();load();
</script>
